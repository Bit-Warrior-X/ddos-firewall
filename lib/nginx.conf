include header.conf;

pid /var/run/l7_firewall.pid;
env PUBKEY_PATH;
env LICENSE_PATH;

http {
    include http_base_header.conf;
    include http_report_ip.conf;
    include http_lua_header.conf;
    include http_lua_acl.conf;
    include backend_list.conf;

     # mlcache needs a shared dict to store cached values
    lua_shared_dict acl_cache 20m;           # used by mlcache (shm)
    lua_shared_dict acl_init_state 1m;       # small shared dict for initialization flags
    lua_shared_dict ipc_shared_dict 10m;     # ipc shared dict for delete/update mlcache

    init_worker_by_lua_block {
        local ok, acl_manager = pcall(require, 'resty.acl_manager')
        if not ok then
            ngx.log(ngx.ERR, "failed to require resty.acl_manager: ", tostring(acl_manager))
            return
        end

        -- initialize mlcache and loaders (must be called in worker init)
        local ok_init, err_init = acl_manager.init()
        if not ok_init then
            ngx.log(ngx.ERR, "acl_manager.init() failed: ", tostring(err_init))
        end

        -- Start Redis subscriber in background (non-blocking)
        local ok_timer, err_timer = ngx.timer.at(0, function(premature)
            if premature then return end
            acl_manager.start_redis_subscriber()
        end)
        if not ok_timer then
            ngx.log(ngx.ERR, "failed to start redis subscriber timer: ", tostring(err_timer))
        end

        -- Primary initial load (best-effort)
        ngx.timer.at(0.1, function(premature)
            if premature then return end
            local ok_load, err_load = acl_manager.load_all_rules()
            if not ok_load then
                ngx.log(ngx.ERR, "initial load_all_rules failed: ", tostring(err_load))
            else
                ngx.log(ngx.INFO, "initial load_all_rules success")
            end
        end)
    }

    server {
        listen 8880;
        listen 80;
        
        access_log /tmp/on main;

        include server_acl.conf;

        location / {
            access_by_lua_block {
                local ok, handle_acl = pcall(require, "resty.handle_acl")
                if not ok then
                    ngx.log(ngx.ERR, "resty.handle_acl needed")
                    return ngx.exit(501)
                end

                -- convert cond -> integer (robust)
                local function convert_cond_int(cond)
                    if type(cond) ~= "string" then return nil end
                    cond = cond:lower():match("^%s*(.-)%s*$")
                    if cond == "block" then return 1
                    elseif cond == "allow" then return 2
                    else return 3
                    end
                end

                -- get apply rules from manager (uses mlcache)
                local ok_mgr, mgr = pcall(require, "resty.acl_manager")
                if not ok_mgr then
                    ngx.log(ngx.ERR, "acl manager is required")
                    return ngx.exit(501)
                end

                -- ensure lazy initialization (idempotent)
                mgr.initialize_on_first_request()

                local rules, err = mgr.get_apply_rules()
                if not rules or #rules == 0 then
                    ngx.log(ngx.INFO, "No apply rules found, allow request")
                    return
                end

                for _, r in ipairs(rules) do
                    local id = r.id
                    if not id then
                        ngx.log(ngx.ERR, "apply rule missing id")
                    else
                        local ret = handle_acl.process_acl_id(id)
                        ngx.log(ngx.DEBUG, "process_acl_id(", id, ") -> ", tonumber(ret))

                        if ret == 6 then return end

                        local cond_int = convert_cond_int(r.cond)
                        if cond_int and ret == cond_int then
                            local k = r.action and r.action.kind
                            if k == "allow" then return
                            elseif k == "block" then return ngx.exit(451)
                            elseif k == "return_code" then return ngx.exit(tonumber(r.action.code) or 451)
                            elseif k == "redirect" then
                                local url = r.action.url
                                if url and #url > 0 then
                                    return ngx.redirect(url)
                                else
                                    return ngx.exit(451)
                                end
                            else
                                return ngx.exit(451)
                            end
                        end
                    end
                end

                return
            }
            
            include location_proxy_setting.conf;
        }
    }

    server {
        listen 9000;
        location / { return 200 "Welcome to Default Server"; }
        location /redirect { return 200 "Redirect URL"; }
    }
}

