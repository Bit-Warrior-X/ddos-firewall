include header.conf;

pid /var/run/l7_firewall.pid;
env PUBKEY_PATH;
env LICENSE_PATH;

http {

    # ----------------------------------------
    # ACL CONDITIONAL LOGGING FLAG
    # ----------------------------------------
    map $acl_blocked $log_acl {
        default 0;
        1       1;
    }

    # ----------------------------------------
    # ACL LOG FORMAT (EXTENDED)
    # ----------------------------------------
    log_format acl_log
        '$remote_addr [$time_local] "$request" '
        'status=$status '
        'rule_id=$acl_rule_id '
        'acl_ret=$acl_ret '
        'redirect="$acl_redirect" '
        'ua="$http_user_agent"';

    include http_base_header.conf;
    include http_report_ip.conf;
    include http_lua_header.conf;
    include http_lua_acl.conf;
    include backend_list.conf;

    # mlcache shared dicts
    lua_shared_dict acl_cache 20m;
    lua_shared_dict acl_init_state 1m;
    lua_shared_dict ipc_shared_dict 10m;
    lua_socket_log_errors off;

    # ----------------------------------------
    # WORKER INIT
    # ----------------------------------------
    init_worker_by_lua_block {
        local ok, acl_manager = pcall(require, 'resty.acl_manager')
        if not ok then
            ngx.log(ngx.ERR, "failed to require resty.acl_manager: ", tostring(acl_manager))
            return
        end

        -- initialize mlcache and loaders
        local ok_init, err_init = acl_manager.init()
        if not ok_init then
            ngx.log(ngx.ERR, "acl_manager.init() failed: ", tostring(err_init))
        end

        -- Start Redis subscriber in background
        local ok_timer, err_timer = ngx.timer.at(0, function(premature)
            if premature then return end
            acl_manager.start_redis_subscriber()
        end)
        if not ok_timer then
            ngx.log(ngx.ERR, "failed to start redis subscriber timer: ", tostring(err_timer))
        end

        -- Primary initial load
        ngx.timer.at(0.1, function(premature)
            if premature then return end
            local ok_load, err_load = acl_manager.load_all_rules()
            if not ok_load then
                ngx.log(ngx.ERR, "initial load_all_rules failed: ", tostring(err_load))
            else
                ngx.log(ngx.INFO, "initial load_all_rules success")
            end
        end)
    }

    # ============================================================
    # MAIN ACL PROTECTED SERVER
    # ============================================================
    server {
        include server_default_ports.conf;

        access_log /tmp/on main;
        access_log /tmp/acl_log acl_log if=$log_acl;

        # Declare ACL logging variables
        set $acl_blocked 0;
        set $acl_ret 0;
        set $acl_redirect "";
        set $acl_rule_id -;

        include server_acl.conf;

        location / {
            access_by_lua_block {

                -- Reset per-request variables
                ngx.var.acl_blocked  = 0
                ngx.var.acl_ret      = "0"
                ngx.var.acl_redirect = ""
                ngx.var.acl_rule_id  = "-"

                local ok, handle_acl = pcall(require, "resty.handle_acl")
                if not ok then
                    ngx.log(ngx.ERR, "resty.handle_acl needed")
                    return ngx.exit(501)
                end

                local function convert_cond_int(cond)
                    if type(cond) ~= "string" then return nil end
                    cond = cond:lower():match("^%s*(.-)%s*$")
                    if cond == "block" then return 1
                    elseif cond == "allow" then return 2
                    else return 3
                    end
                end

                local ok_mgr, mgr = pcall(require, "resty.acl_manager")
                if not ok_mgr then
                    ngx.log(ngx.ERR, "acl manager is required")
                    return ngx.exit(501)
                end

                mgr.initialize_on_first_request()

                local rules, err = mgr.get_apply_rules()
                if not rules or #rules == 0 then
                    ngx.log(ngx.INFO, "No apply rules found, allow request")
                    return
                end

                local function mark_blocked(id, raw_ret, redirect_url)
                    ngx.var.acl_blocked  = 1
                    ngx.var.acl_ret      = tostring(tonumber(raw_ret) or 0)
                    ngx.var.acl_redirect = redirect_url or ""
                    ngx.var.acl_rule_id  = tostring(id or "-")
                end

                for _, r in ipairs(rules) do
                    if r.status ~= "disabled" then
                        local id = r.id
                        if not id then
                            ngx.log(ngx.ERR, "apply rule missing id")
                        else
                            local raw_ret = handle_acl.process_acl_id(id)

                            -- always store RAW enum for logging
                            ngx.var.acl_ret = tostring(tonumber(raw_ret) or 0)
                            ngx.log(ngx.DEBUG, "process_acl_id(", id, ") -> ", raw_ret)

                            -- Treat NO_LICENSE as block
                            if raw_ret == 6 then
                                mark_blocked(id, raw_ret, nil)
                                return ngx.exit(451)
                            end

                            -- Normalize return value for decision
                            local ret_norm = raw_ret
                            if raw_ret == 2 or raw_ret == 4 then
                                ret_norm = 2 -- allow
                            elseif raw_ret == 1 or raw_ret == 3 or raw_ret == 5 then
                                ret_norm = 1 -- block
                            end

                            local cond_int = convert_cond_int(r.cond)
                            if cond_int and ret_norm == cond_int then
                                local k = r.action and r.action.kind

                                if k == "allow" then
                                    return

                                elseif k == "block" then
                                    mark_blocked(id, raw_ret, nil)
                                    return ngx.exit(451)

                                elseif k == "return_code" then
                                    mark_blocked(id, raw_ret, nil)
                                    return ngx.exit(tonumber(r.action.code) or 451)

                                elseif k == "redirect" then
                                    local url = r.action.url
                                    mark_blocked(id, raw_ret, url)
                                    if url and #url > 0 then
                                        return ngx.redirect(url)
                                    else
                                        return ngx.exit(451)
                                    end

                                else
                                    mark_blocked(id, raw_ret, nil)
                                    return ngx.exit(451)
                                end
                            end
                        end
                    end
                end

                return
            }

            include location_proxy_setting.conf;
        }
    }

    # ============================================================
    # DEFAULT SERVER
    # ============================================================
    server {
        listen 9000;
        location / { return 200 "Welcome to Default Server"; }
        location /redirect { return 200 "Redirect URL"; }
    }
}
