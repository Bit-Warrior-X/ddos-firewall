# Initial config for the local Redis instance (unix socket only).
# Shared by OpenResty and api_parser on /tmp/redis.sock.
#
# Database layout:
#   db 0 — ACL rules, upstreams, cache rules, temporary blacklist (api_parser + OpenResty Lua)
#   db 2 — nginx cache purge index (ngx_cache_purge C module + resty.cache_purge_sync)
#
# Pub/sub channels (acl:updates, temporaryblacklist:added) do NOT need
# notify-keyspace-events. Only the keyevent subscribers below do.
#
# notify-keyspace-events reference:
#   AKE  — all keyspace + all keyevent + all command classes (broad; extra CPU on busy instances)
#   Exg$ — keyevent + expired + generic + string only (enough for cache purge db 2)
#   Exgh$ — Exg$ plus hash commands (adds ACL keyspace fallback on db 0)
#
# OpenResty consumers:
#   resty.acl_manager        — pub/sub "acl:updates" (primary); keyevent fallback on db 0
#                              needs: E x g $ h  (set, hset, del, expired)
#   resty.cache_purge_sync   — keyevent on db 2
#                              needs: E x g $    (setex, del, expired)
#   resty.temp_blacklist     — pub/sub only (no keyspace flags required)
#
# api_parser consumers:
#   temporary_blacklist_monitor — pub/sub "temporaryblacklist:added" (no keyspace flags required)
#   redis_client                — SET/PUBLISH/DEL (no keyspace flags required)
#
# Use Exgh$: covers both OpenResty keyevent subscribers without the overhead of AKE.

port 0
unixsocket /tmp/redis.sock
unixsocketperm 770
daemonize yes
timeout 0

logfile /var/log/redis/redis-socket.log
dir /var/lib/redis
dbfilename dump.rdb

notify-keyspace-events Exgh$

appendonly yes
appendfilename "appendonly.aof"

# AOF fsync policy (choose one)
appendfsync everysec
# appendfsync always   # strongest durability — slow
# appendfsync no       # let OS decide — faster but more risk

# RDB snapshotting rules (optional)
save 900 1
save 300 10
save 60 10000
