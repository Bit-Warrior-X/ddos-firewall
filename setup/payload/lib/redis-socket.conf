#Inital config for Redis-Server
port 0
unixsocket /tmp/redis.sock
unixsocketperm 770
daemonize no
logfile /var/log/redis/redis-socket.log
dir /var/lib/redis
notify-keyspace-events AKE
timeout 0

# Where Redis stores DB files
dir /var/lib/redis
dbfilename dump.rdb 
appendonly yes        
appendfilename "appendonly.aof"

# AOF fsync policy (choose one)
appendfsync everysec  
# appendfsync always   # strongest durability — slow
# appendfsync no       # let OS decide — faster but more risk

# RDB snapshotting rules (optional)
save 900 1   
save 300 10
save 60 10000