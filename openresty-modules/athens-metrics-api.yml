openapi: 3.0.3
info:
  title: Athens Metrics API
  description: |
    L7/L4 metrics exposed by Athens (OpenResty) on the internal stats server.

    - Base URL: `http://{edge}:9000`
    - Interval: 60s buckets (except `/req-status`, which is ~10s live bandwidth)
    - L7 dimension and site metrics are keyed by `site_id` from Redis `domain:{host}`
    - Unmapped Hosts use `site_id` `0`
    - Traffic fields are **bytes**; bandwidth fields are **bits/s** over the interval
  version: 1.2.1

servers:
  - url: http://{host}:9000
    description: Athens stats / purge listener
    variables:
      host:
        default: 127.0.0.1

tags:
  - name: Server
    description: Edge-wide aggregates (includes NIC)
  - name: Site
    description: Per-site L7 aggregates (`site_id`)
  - name: Dimensions
    description: Per-site breakdowns (IP, URL, UA, country, ISP, referer, domain)
  - name: Bandwidth
    description: Live ngx_req_status bandwidth by Host
  - name: L4
    description: Sparta eBPF traffic / attack counters

paths:
  /server_traffic_stats:
    get:
      tags: [Server]
      summary: Server-wide traffic snapshot
      description: |
        Latest (or historical) edge-wide stats including NIC and summed L7 counters.
        Without `timestamp`, returns the newest history bucket.
      operationId: getServerTrafficStats
      parameters:
        - $ref: '#/components/parameters/Timestamp'
      responses:
        '200':
          description: Server traffic stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerTrafficStats'
              examples:
                latest:
                  $ref: '#/components/examples/ServerTrafficStatsExample'
        '404':
          $ref: '#/components/responses/NotFound'

  /server_traffic_stats/timestamps:
    get:
      tags: [Server]
      summary: Available server_traffic_stats timestamps
      operationId: getServerTrafficStatsTimestamps
      responses:
        '200':
          $ref: '#/components/responses/TimestampList'

  /site_traffic_stats:
    get:
      tags: [Site]
      summary: Per-site L7 traffic snapshot
      description: |
        Same L7 counters as server traffic, partitioned by `site_id`. No NIC fields.
        Live (no `timestamp`) reads the current 60s window; with `timestamp` reads history.
      operationId: getSiteTrafficStats
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Site traffic stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteTrafficStatsResponse'
              examples:
                allSites:
                  $ref: '#/components/examples/SiteTrafficStatsAllExample'
                oneSite:
                  $ref: '#/components/examples/SiteTrafficStatsFilteredExample'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Error'

  /site_traffic_stats/timestamps:
    get:
      tags: [Site]
      summary: Available site_traffic_stats timestamps
      operationId: getSiteTrafficStatsTimestamps
      responses:
        '200':
          $ref: '#/components/responses/TimestampList'

  /domain_request_stats:
    get:
      tags: [Dimensions]
      summary: Per-site domain (Host) request / traffic stats
      operationId: getDomainRequestStats
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Domain request stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainRequestStatsResponse'
              examples:
                sample:
                  $ref: '#/components/examples/DomainRequestStatsExample'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Error'

  /domain_request_stats/timestamps:
    get:
      tags: [Dimensions]
      summary: Available domain_request_stats timestamps
      operationId: getDomainRequestStatsTimestamps
      responses:
        '200':
          $ref: '#/components/responses/TimestampList'

  /ip_request_stats:
    get:
      tags: [Dimensions]
      summary: Per-site client IP request counts
      operationId: getIpRequestStats
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: IP request stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IpRequestStatsResponse'
              examples:
                sample:
                  $ref: '#/components/examples/IpRequestStatsExample'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Error'

  /ip_request_stats/timestamps:
    get:
      tags: [Dimensions]
      summary: Available ip_request_stats timestamps
      operationId: getIpRequestStatsTimestamps
      responses:
        '200':
          $ref: '#/components/responses/TimestampList'

  /url_request_stats:
    get:
      tags: [Dimensions]
      summary: Per-site URL path request counts
      operationId: getUrlRequestStats
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: URL request stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UrlRequestStatsResponse'
              examples:
                sample:
                  $ref: '#/components/examples/UrlRequestStatsExample'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Error'

  /url_request_stats/timestamps:
    get:
      tags: [Dimensions]
      summary: Available url_request_stats timestamps
      operationId: getUrlRequestStatsTimestamps
      responses:
        '200':
          $ref: '#/components/responses/TimestampList'

  /useragent_request_stats:
    get:
      tags: [Dimensions]
      summary: Per-site User-Agent request counts
      operationId: getUserAgentRequestStats
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: User-Agent request stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAgentRequestStatsResponse'
              examples:
                sample:
                  $ref: '#/components/examples/UserAgentRequestStatsExample'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Error'

  /useragent_request_stats/timestamps:
    get:
      tags: [Dimensions]
      summary: Available useragent_request_stats timestamps
      operationId: getUserAgentRequestStatsTimestamps
      responses:
        '200':
          $ref: '#/components/responses/TimestampList'

  /country_request_stats:
    get:
      tags: [Dimensions]
      summary: Per-site country request / block counts
      operationId: getCountryRequestStats
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Country request stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountryRequestStatsResponse'
              examples:
                sample:
                  $ref: '#/components/examples/CountryRequestStatsExample'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Error'

  /country_request_stats/timestamps:
    get:
      tags: [Dimensions]
      summary: Available country_request_stats timestamps
      operationId: getCountryRequestStatsTimestamps
      responses:
        '200':
          $ref: '#/components/responses/TimestampList'

  /isp_request_stats:
    get:
      tags: [Dimensions]
      summary: Per-site ISP request counts
      operationId: getIspRequestStats
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: ISP request stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IspRequestStatsResponse'
              examples:
                sample:
                  $ref: '#/components/examples/IspRequestStatsExample'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Error'

  /isp_request_stats/timestamps:
    get:
      tags: [Dimensions]
      summary: Available isp_request_stats timestamps
      operationId: getIspRequestStatsTimestamps
      responses:
        '200':
          $ref: '#/components/responses/TimestampList'

  /referer_request_stats:
    get:
      tags: [Dimensions]
      summary: Per-site Referer request counts
      operationId: getRefererRequestStats
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Referer request stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefererRequestStatsResponse'
              examples:
                sample:
                  $ref: '#/components/examples/RefererRequestStatsExample'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Error'

  /referer_request_stats/timestamps:
    get:
      tags: [Dimensions]
      summary: Available referer_request_stats timestamps
      operationId: getRefererRequestStatsTimestamps
      responses:
        '200':
          $ref: '#/components/responses/TimestampList'

  /req-status:
    get:
      tags: [Bandwidth]
      summary: Live per-Host bandwidth (ngx_req_status)
      description: |
        C-module live view keyed by `$host` (~10s). Not site-scoped; join Host → `site_id`
        via `/domain_request_stats` or Redis `domain:{host}`.
      operationId: getReqStatus
      parameters:
        - name: domain
          in: query
          schema:
            type: string
          description: Filter by Host / domain name
        - name: zone_name
          in: query
          schema:
            type: string
          description: Filter by zone name (Athens uses `host`)
        - name: bandwidth
          in: query
          schema:
            type: string
            enum: [true, false]
          description: If `true`, only non-zero bandwidth rows
        - name: active
          in: query
          schema:
            type: string
            enum: [true, false]
          description: If `true`, only currently active rows
      responses:
        '200':
          description: Live req-status JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReqStatusResponse'
              examples:
                sample:
                  $ref: '#/components/examples/ReqStatusExample'
            text/plain:
              schema:
                $ref: '#/components/schemas/ReqStatusResponse'
              examples:
                sample:
                  $ref: '#/components/examples/ReqStatusExample'

  /l4_attack_stats:
    get:
      tags: [L4]
      summary: L4 traffic / attack stats (Sparta)
      description: Without `timestamp`, returns the latest available Sparta bucket.
      operationId: getL4AttackStats
      parameters:
        - $ref: '#/components/parameters/Timestamp'
      responses:
        '200':
          description: L4 stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/L4AttackStatsResponse'
              examples:
                sample:
                  $ref: '#/components/examples/L4AttackStatsExample'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Error'

  /l4_attack_stats/timestamps:
    get:
      tags: [L4]
      summary: Available L4 attack stats timestamps
      operationId: getL4AttackStatsTimestamps
      responses:
        '200':
          $ref: '#/components/responses/TimestampList'

components:
  parameters:
    Timestamp:
      name: timestamp
      in: query
      required: false
      description: Unix epoch for a 60s history bucket (or Sparta L4 bucket)
      schema:
        type: integer
        format: int64
        example: 1723900800

    SiteId:
      name: siteId
      in: query
      required: false
      description: |
        Filter to one site. Alias `site_id` is also accepted.
        `0` means unmapped Host.
      schema:
        type: integer
        example: 12

  responses:
    TimestampList:
      description: Sorted list of available history timestamps
      content:
        application/json:
          schema:
            type: array
            items:
              type: string
          examples:
            sample:
              summary: Available 60s buckets
              value: ["1723900680", "1723900740", "1723900800"]

    NotFound:
      description: No data for the requested timestamp / resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missing:
              summary: Timestamp not found
              value:
                error: "No data found for timestamp 1723900800"

    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            badRequest:
              summary: Invalid query
              value:
                error: "Invalid timestamp"

