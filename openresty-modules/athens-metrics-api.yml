    L7Counters:
      type: object
      description: Shared L7 counter fields (bytes / counts over the interval)
      properties:
        traffic_l7_rx:
          type: number
          description: Request body bytes received
        traffic_l7_tx:
          type: number
          description: Response bytes sent
        bandwidth_l7_rx:
          type: number
          description: Request bits/s over the 60s interval
        bandwidth_l7_tx:
          type: number
          description: Response bits/s over the 60s interval
        request_count:
          type: integer
        response_count:
          type: integer
          description: Excludes 408/444/499/5xx/904/929/978
        blocked_request_count:
          type: integer
        ip_count:
          type: integer
          description: Unique client IPs in the interval
        blocked_ip_count:
          type: integer
          description: Unique blocked IPs in the interval
        code200:
          type: integer
        code206:
          type: integer
        code301:
          type: integer
        code302:
          type: integer
        code400:
          type: integer
        code403:
          type: integer
        code404:
          type: integer
        code444:
          type: integer
        code499:
          type: integer
        code500:
          type: integer
        code501:
          type: integer
        code502:
          type: integer
        code503:
          type: integer
        code504:
          type: integer
        code904:
          type: integer
        code929:
          type: integer
        code978:
          type: integer
        get_count:
          type: integer
        post_count:
          type: integer
        delete_count:
          type: integer
        put_count:
          type: integer
        head_count:
          type: integer
        patch_count:
          type: integer
        options_count:
          type: integer
        others_count:
          type: integer
        http1_0_count:
          type: integer
        http1_1_count:
          type: integer
        http2_count:
          type: integer
        http3_count:
          type: integer
      additionalProperties:
        type: number
        description: Extra `codeNNN` counters may appear when seen

    ServerTrafficStats:
      allOf:
        - type: object
          required: [timestamp]
          properties:
            timestamp:
              type: integer
              format: int64
            traffic_nic_rx:
              type: number
              description: NIC RX bytes (from firewall.config `dev=`)
            traffic_nic_tx:
              type: number
            bandwidth_nic_rx:
              type: number
              description: NIC RX bits/s
            bandwidth_nic_tx:
              type: number
        - $ref: '#/components/schemas/L7Counters'

    SiteTrafficItem:
      allOf:
        - type: object
          required: [site_id]
          properties:
            site_id:
              type: integer
              description: Site id; `0` = unmapped Host
        - $ref: '#/components/schemas/L7Counters'

    SiteTrafficStatsResponse:
      type: object
      required: [timestamp, site_traffic_stats]
      properties:
        timestamp:
          type: integer
          format: int64
        site_id:
          type: integer
          description: Echoed when filtered with `siteId`
        site_traffic_stats:
          type: array
          items:
            $ref: '#/components/schemas/SiteTrafficItem'

    DomainRequestItem:
      type: object
      required: [site_id, domain, request_count]
      properties:
        site_id:
          type: integer
        domain:
          type: string
          description: Request Host
        request_count:
          type: integer
        traffic_l7_rx:
          type: number
        traffic_l7_tx:
          type: number
        bandwidth_l7_rx:
          type: number
        bandwidth_l7_tx:
          type: number

    DomainRequestStatsResponse:
