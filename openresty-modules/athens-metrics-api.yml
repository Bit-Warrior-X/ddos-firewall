  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: "No data found for timestamp 1723900800"

    L7Counters:
      type: object
      description: Shared L7 counter fields (bytes / counts over the interval)
      properties:
        traffic_l7_rx:
          type: number
          description: Request body bytes received
        traffic_l7_tx:
          type: number
          description: Response bytes sent
        bandwidth_l7_rx:
          type: number
          description: Request bits/s over the 60s interval
        bandwidth_l7_tx:
          type: number
          description: Response bits/s over the 60s interval
        request_count:
          type: integer
        response_count:
          type: integer
          description: Excludes 408/444/499/5xx/904/929/978
        blocked_request_count:
          type: integer
        ip_count:
          type: integer
          description: Unique client IPs in the interval
        blocked_ip_count:
          type: integer
          description: Unique blocked IPs in the interval
        code200:
          type: integer
        code206:
          type: integer
        code301:
          type: integer
        code302:
          type: integer
        code400:
          type: integer
        code403:
          type: integer
        code404:
          type: integer
        code444:
          type: integer
        code499:
          type: integer
        code500:
          type: integer
        code501:
          type: integer
        code502:
          type: integer
        code503:
          type: integer
        code504:
          type: integer
        code904:
          type: integer
        code929:
          type: integer
        code978:
          type: integer
        get_count:
          type: integer
        post_count:
          type: integer
        delete_count:
          type: integer
        put_count:
          type: integer
        head_count:
          type: integer
        patch_count:
          type: integer
        options_count:
          type: integer
        others_count:
          type: integer
        http1_0_count:
          type: integer
        http1_1_count:
          type: integer
        http2_count:
          type: integer
        http3_count:
          type: integer
        cache_hit_count:
          type: integer
          description: '`$upstream_cache_status` = `HIT`'
        cache_stale_count:
          type: integer
          description: '`STALE` (served stale while origin unavailable)'
        cache_updating_count:
          type: integer
          description: '`UPDATING` (served stale while refreshing)'
        cache_revalidated_count:
          type: integer
          description: '`REVALIDATED` (conditional request to origin returned 304)'
        cache_miss_count:
          type: integer
          description: '`MISS`'
        cache_expired_count:
          type: integer
          description: '`EXPIRED` (cached copy too old, refetched)'
        cache_bypass_count:
          type: integer
          description: '`BYPASS` (`proxy_cache_bypass` matched)'
        cache_dynamic_count:
          type: integer
          description: |
            Not blocked, empty / `-` cache status (no cache zone for the location).
            All eight cache counters sum to `request_count - blocked_request_count`.
        cache_hit_ratio:
          type: number
          minimum: 0
          maximum: 1
          description: |
            (hit + stale + updating + revalidated) / (request_count - blocked_request_count).
            Informational only; the backend recomputes ratios from the counters.
        traffic_cached_tx:
          type: number
          description: Response bytes for cached statuses (HIT, STALE, UPDATING, REVALIDATED)
        origin_request_count:
          type: integer
          description: |
            Requests that contacted origin (`$upstream_addr` set), counting retries
            once. Equals the sum of `origin_code*`, `origin_timeout_count` and
            `origin_error_count`, and the sum of `origin_latency_hist`.
        traffic_origin_rx:
          type: number
          description: Bytes received from origin (`$upstream_bytes_received`)
        origin_code2xx:
          type: integer
          description: Origin responded with 2xx (final `$upstream_status`)
        origin_code3xx:
          type: integer
        origin_code4xx:
          type: integer
        origin_code5xx:
          type: integer
          description: Origin itself responded with 5xx (excludes timeouts / connect errors)
        origin_timeout_count:
          type: integer
          description: No response from origin within `proxy_connect_timeout` / `proxy_read_timeout`
        origin_error_count:
          type: integer
          description: Connection refused / reset / DNS or TLS failure before a response
        edge_latency_hist:
          $ref: '#/components/schemas/LatencyHistogram'
        edge_latency_sum_ms:
          type: number
          description: Sum of `$request_time` in ms for requests in `edge_latency_hist`
        origin_latency_hist:
          $ref: '#/components/schemas/LatencyHistogram'
        origin_latency_sum_ms:
          type: number
          description: Sum of `$upstream_response_time` in ms (comma-separated attempts summed)
      additionalProperties:
        type: number
        description: Extra `codeNNN` counters may appear when seen

    LatencyHistogram:
      type: array
      description: |
        11 non-cumulative counts for upper bounds
        `[10, 25, 50, 100, 250, 500, 1000, 2500, 5000, 10000, +Inf]` ms.
        `edge_latency_hist` covers non-blocked requests (`$request_time`, time to last
        byte sent to the client); `origin_latency_hist` covers `origin_request_count`
        (`$upstream_response_time`, attempts summed). Omit or send all zeros when empty.
      minItems: 11
      maxItems: 11
      items:
        type: integer
        minimum: 0
      example: [3600, 2300, 1600, 1000, 700, 470, 240, 100, 30, 12, 8]

