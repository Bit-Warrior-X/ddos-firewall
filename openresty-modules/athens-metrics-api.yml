          type: integer
          format: int64
        site_id:
          type: integer
        block_reason_stats:
          type: array
          items:
            $ref: '#/components/schemas/BlockReasonItem'

    AccessLogRecord:
      type: object
      description: One request. Sent as one JSON object per line.
      required: [time, site_id, client_ip, method, host, uri, status, bytes_sent, blocked]
      properties:
        time:
          type: string
          format: date-time
          description: Request end time, RFC 3339 UTC with milliseconds
        request_id:
          type: string
          description: '`$request_id`'
        site_id:
          type: integer
        client_ip:
          type: string
        country_iso:
          type: string
          nullable: true
        method:
          type: string
        scheme:
          type: string
          enum: [http, https]
        host:
          type: string
        uri:
          type: string
          description: '`$request_uri` (path and query string)'
        protocol:
          type: string
          example: HTTP/2.0
        status:
          type: integer
          description: Status sent to the client (including 444 / 9xx block codes)
        bytes_sent:
          type: integer
        request_length:
          type: integer
        referer:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        content_type:
          type: string
          nullable: true
        cache_status:
          type: string
          nullable: true
          enum: [HIT, MISS, EXPIRED, STALE, UPDATING, REVALIDATED, BYPASS, null]
          description: '`null` when not cached (dynamic) or blocked'
        request_time_ms:
          type: number
        upstream_status:
          type: integer
          nullable: true
          description: Final origin status; `null` when origin was not contacted
        upstream_response_time_ms:
          type: number
          nullable: true
        upstream_bytes_received:
          type: integer
        blocked:
          type: boolean
        rule_type:
          type: string
          nullable: true
          enum: [blacklist, geo, anti-cc, second-freq-limit, interval-freq-limit, user-agent, anti-header, response-freq, ip-reputation, temporary-block, other, null]
          description: '`WafRuleType`; set when `blocked` is true'
        rule_id:
          type: string
          nullable: true

    ReqStatusItem:
      type: object
      properties:
        domain:
          type: string
          description: Host key (`$host`)
        zone_name:
          type: string
          example: host
        bandwidth:
          oneOf:
            - type: integer
            - type: string
          description: Live bandwidth in bits/s (~10s window)
        active:
          type: integer
          description: In-flight requests for this Host

    ReqStatusResponse:
      type: object
      properties:
        timestamp:
          type: integer
          format: int64
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReqStatusItem'

    L4Stats:
      type: object
      properties:
        total:
          type: integer
        allow:
          type: integer
        block:
          type: integer
        syn:
          type: integer
        ack:
          type: integer
        rst:
          type: integer
        tcp:
          type: integer
        udp:
          type: integer
        icmp:
          type: integer
        gre:
          type: integer
        other:
          type: integer

    L4AttackStatsResponse:
      type: object
      required: [timestamp, stats]
      properties:
        timestamp:
          type: integer
          format: int64
        stats:
          $ref: '#/components/schemas/L4Stats'
