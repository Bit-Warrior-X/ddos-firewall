        rule_id:
          type: string
          description: Id of the WAF rule from site config, when known
        request_count:
          type: integer
          description: Blocked requests attributed to this rule
        ip_count:
          type: integer
          description: Unique client IPs blocked by this rule in the interval

    BlockReasonStatsResponse:
      type: object
      required: [timestamp, block_reason_stats]
      properties:
