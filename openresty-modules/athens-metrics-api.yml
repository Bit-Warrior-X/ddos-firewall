openapi: 3.0.3
info:
  title: Athens Metrics API
  description: |
    L7/L4 metrics exposed by Athens (OpenResty) on the internal stats server.

    - Base URL: `http://{edge}:9000`
    - Interval: 60s buckets (except `/req-status`, which is ~10s live bandwidth)
    - L7 dimension and site metrics are keyed by `site_id` from Redis `domain:{host}`
    - Unmapped Hosts use `site_id` `0`
    - Traffic fields are **bytes**; bandwidth fields are **bits/s** over the interval
    - `/…/timestamps` lists **closed** buckets only; the bucket being filled is never listed

    ### Required access-log variables (1.3.0)
    Cache, performance, firewall and log-export data is derived from these nginx variables,
    which must be captured for every request:
    `$upstream_cache_status`, `$request_time`, `$upstream_response_time`,
    `$upstream_status`, `$upstream_bytes_received`, `$sent_http_content_type`,
    `$request_id`, plus the WAF rule type / rule id set by the Lua layer when it blocks.

    ### Cache status mapping
    | `$upstream_cache_status` | Counter | Counts as cached |
    |---|---|---|
    | `HIT` | `cache_hit_count` | yes |
    | `STALE` | `cache_stale_count` | yes |
    | `UPDATING` | `cache_updating_count` | yes |
    | `REVALIDATED` | `cache_revalidated_count` | yes |
    | `MISS` | `cache_miss_count` | no |
    | `EXPIRED` | `cache_expired_count` | no |
    | `BYPASS` | `cache_bypass_count` | no |
    | empty / `-` (no cache zone, proxied) | `cache_dynamic_count` | no |

    Blocked requests are excluded from cache counters, so per bucket:
    `sum(cache_*_count) = request_count - blocked_request_count`.

    ### Latency histograms
    `edge_latency_hist` and `origin_latency_hist` are arrays of **11 non-cumulative counts**
    using these upper bounds in milliseconds (bucket `i` counts values `<= bound[i]`
    and `> bound[i-1]`):
    `[10, 25, 50, 100, 250, 500, 1000, 2500, 5000, 10000, +Inf]`.
    The backend merges histograms across buckets and edges to compute p50 / p95 / p99,
    so percentiles must not be pre-computed on the edge.
  version: 1.3.0

servers:
  - url: http://{host}:9000
    description: Athens stats / purge listener
    variables:
      host:
        default: 127.0.0.1

tags:
  - name: Server
    description: Edge-wide aggregates (includes NIC)
  - name: Site
    description: Per-site L7 aggregates (`site_id`)
  - name: Dimensions
    description: Per-site breakdowns (IP, URL, UA, country, ISP, referer, domain)
  - name: Bandwidth
    description: Live ngx_req_status bandwidth by Host
  - name: L4
    description: Sparta eBPF traffic / attack counters
  - name: Cache
    description: Per-site cache breakdowns (content type, missed URLs)
  - name: Security
    description: Per-site L7 blocks broken down by WAF rule type
  - name: Logs
    description: Raw access / security log records retained on the edge

paths:
  /server_traffic_stats:
    get:
      tags: [Server]
      summary: Server-wide traffic snapshot
      description: |
        Latest (or historical) edge-wide stats including NIC and summed L7 counters.
        Without `timestamp`, returns the newest **closed** history bucket (never the
        60s window still being filled). The backend fetches every bucket listed by
        `/server_traffic_stats/timestamps`, so history must be kept for at least 1 hour.
      operationId: getServerTrafficStats
      parameters:
        - $ref: '#/components/parameters/Timestamp'
      responses:
        '200':
          description: Server traffic stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerTrafficStats'
              examples:
                latest:
                  $ref: '#/components/examples/ServerTrafficStatsExample'
        '404':
          $ref: '#/components/responses/NotFound'

  /server_traffic_stats/timestamps:
    get:
      tags: [Server]
      summary: Available server_traffic_stats timestamps
      operationId: getServerTrafficStatsTimestamps
      responses:
        '200':
          $ref: '#/components/responses/TimestampList'

  /site_traffic_stats:
    get:
      tags: [Site]
      summary: Per-site L7 traffic snapshot
      description: |
        Same L7 counters as server traffic, partitioned by `site_id`. No NIC fields.
        Live (no `timestamp`) reads the current 60s window; with `timestamp` reads history.
      operationId: getSiteTrafficStats
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Site traffic stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteTrafficStatsResponse'
              examples:
                allSites:
                  $ref: '#/components/examples/SiteTrafficStatsAllExample'
                oneSite:
                  $ref: '#/components/examples/SiteTrafficStatsFilteredExample'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Error'

  /site_traffic_stats/timestamps:
    get:
      tags: [Site]
      summary: Available site_traffic_stats timestamps
      operationId: getSiteTrafficStatsTimestamps
      responses:
        '200':
          $ref: '#/components/responses/TimestampList'

  /domain_request_stats:
    get:
      tags: [Dimensions]
      summary: Per-site domain (Host) request / traffic stats
      operationId: getDomainRequestStats
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Domain request stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainRequestStatsResponse'
              examples:
                sample:
                  $ref: '#/components/examples/DomainRequestStatsExample'
        '404':
