    WafRuleType:
      type: string
      description: |
        Rule that made the final block decision:
        `blacklist` IP / CIDR deny list ·
        `geo` country / region rule ·
        `anti-cc` CC / challenge protection ·
        `second-freq-limit` per-second request rate limit ·
        `interval-freq-limit` per-interval request rate limit ·
        `user-agent` User-Agent rule ·
        `anti-header` header / method / protocol rule ·
        `response-freq` too many error responses (e.g. 404 flood) ·
        `ip-reputation` threat-intel / reputation list ·
        `temporary-block` IP still inside a temporary ban from an earlier hit ·
        `other` any block not covered above
      enum:
        - blacklist
        - geo
        - anti-cc
        - second-freq-limit
        - interval-freq-limit
        - user-agent
        - anti-header
        - response-freq
        - ip-reputation
        - temporary-block
        - other

    BlockReasonItem:
      type: object
      required: [site_id, rule_type, request_count]
      properties:
