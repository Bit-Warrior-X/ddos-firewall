  /cache_miss_url_stats:
    get:
      tags: [Cache]
      summary: Per-site URLs most often fetched from origin
      description: |
        Top 100 URL paths per site per bucket, ordered by `miss_count` descending.
        A miss is `MISS` or `EXPIRED`. Query strings are stripped, as in `/url_request_stats`.
      operationId: getCacheMissUrlStats
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/SiteId'
      responses:
