  /block_reason_stats:
    get:
      tags: [Security]
      summary: Per-site blocked requests by WAF rule type
      description: |
        Every blocked request is attributed to exactly one `rule_type` (the rule that
        made the final decision), so per site and bucket:
        `sum(request_count) = blocked_request_count` in `/site_traffic_stats`.
      operationId: getBlockReasonStats
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/SiteId'
      responses:
