      responses:
        '200':
          $ref: '#/components/responses/TimestampList'

  /access_logs:
    get:
      tags: [Logs]
      summary: Stream raw access / security log records
      description: |
        Streams one JSON object per line (NDJSON), oldest first, for `[start, end)`.
        The edge must retain at least **7 days** of records.

        - `type=access`: every request
        - `type=security`: only blocked requests (`blocked: true`)

        Results are paged: when more records exist than `limit`, the response sets
        `X-Next-Cursor`; pass it back as `cursor` with the same filters to continue.
        An absent header means the range is complete.
      operationId: getAccessLogs
      parameters:
        - name: start
          in: query
          required: true
          description: Range start, Unix epoch seconds (inclusive)
          schema:
            type: integer
            format: int64
            example: 1723900800
        - name: end
          in: query
          required: true
          description: Range end, Unix epoch seconds (exclusive)
          schema:
            type: integer
            format: int64
            example: 1723904400
        - $ref: '#/components/parameters/SiteId'
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [access, security]
            default: access
        - name: limit
          in: query
          required: false
          description: Max records in this page
          schema:
            type: integer
            default: 50000
            maximum: 200000
        - name: cursor
          in: query
          required: false
          description: Opaque value from a previous `X-Next-Cursor` header
          schema:
            type: string
      responses:
        '200':
          description: NDJSON stream of log records
          headers:
            X-Next-Cursor:
              description: Present when more records remain
              schema:
                type: string
            X-Retention-Start:
              description: Oldest retained record, Unix epoch seconds
              schema:
                type: integer
                format: int64
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/AccessLogRecord'
              examples:
                sample:
                  $ref: '#/components/examples/AccessLogRecordExample'
        '400':
          $ref: '#/components/responses/Error'
        '416':
          description: Requested range is older than retention
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                expired:
                  summary: Outside retention
                  value:
                    error: "Range starts before retained logs (1723300000)"
        '500':
          $ref: '#/components/responses/Error'

  /req-status:
    get:
      tags: [Bandwidth]
      summary: Live per-Host bandwidth (ngx_req_status)
      description: |
        C-module live view keyed by `$host` (~10s). Not site-scoped; join Host → `site_id`
        via `/domain_request_stats` or Redis `domain:{host}`.
      operationId: getReqStatus
      parameters:
        - name: domain
          in: query
          schema:
            type: string
          description: Filter by Host / domain name
        - name: zone_name
          in: query
          schema:
            type: string
          description: Filter by zone name (Athens uses `host`)
        - name: bandwidth
          in: query
          schema:
            type: string
            enum: ['true', 'false']
          description: If `true`, only non-zero bandwidth rows
        - name: active
          in: query
          schema:
            type: string
            enum: ['true', 'false']
          description: If `true`, only currently active rows
      responses:
        '200':
          description: Live req-status JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReqStatusResponse'
              examples:
                sample:
                  $ref: '#/components/examples/ReqStatusExample'
            text/plain:
              schema:
                $ref: '#/components/schemas/ReqStatusResponse'
              examples:
                sample:
                  $ref: '#/components/examples/ReqStatusExample'

  /l4_attack_stats:
    get:
      tags: [L4]
      summary: L4 traffic / attack stats (Sparta)
      description: Without `timestamp`, returns the latest available Sparta bucket.
      operationId: getL4AttackStats
      parameters:
        - $ref: '#/components/parameters/Timestamp'
      responses:
        '200':
          description: L4 stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/L4AttackStatsResponse'
              examples:
                sample:
                  $ref: '#/components/examples/L4AttackStatsExample'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Error'

  /l4_attack_stats/timestamps:
    get:
      tags: [L4]
      summary: Available L4 attack stats timestamps
      operationId: getL4AttackStatsTimestamps
      responses:
        '200':
          $ref: '#/components/responses/TimestampList'

components:
  parameters:
    Timestamp:
      name: timestamp
      in: query
      required: false
      description: Unix epoch for a 60s history bucket (or Sparta L4 bucket)
      schema:
        type: integer
        format: int64
        example: 1723900800

    SiteId:
      name: siteId
      in: query
      required: false
      description: |
        Filter to one site. Alias `site_id` is also accepted.
        `0` means unmapped Host.
      schema:
        type: integer
        example: 12

  responses:
    TimestampList:
      description: Sorted list of available history timestamps (closed buckets only)
      content:
        application/json:
          schema:
            type: array
            items:
              type: string
          examples:
            sample:
              summary: Available 60s buckets
              value: ["1723900680", "1723900740", "1723900800"]

    NotFound:
      description: No data for the requested timestamp / resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missing:
              summary: Timestamp not found
              value:
                error: "No data found for timestamp 1723900800"

    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            badRequest:
              summary: Invalid query
              value:
                error: "Invalid timestamp"

