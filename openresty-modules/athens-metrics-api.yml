  /content_type_request_stats:
    get:
      tags: [Cache]
      summary: Per-site requests / bytes / cache hits by content type family
      description: |
        Grouped by the family of `$sent_http_content_type` (see `ContentTypeFamily`).
        Blocked requests are excluded.
      operationId: getContentTypeRequestStats
      parameters:
