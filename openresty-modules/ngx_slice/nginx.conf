#user openresty;
user nginx;
#daemon off;

#error_log /dev/stdout info;

worker_processes        auto;
worker_cpu_affinity     auto;
worker_rlimit_nofile    51200;
worker_shutdown_timeout 60s;

events {
    multi_accept on;
    use          epoll;

    worker_connections  51200;
}

http {

    proxy_cache_background_update   on;
    proxy_cache_revalidate          on;

    proxy_cache_methods GET HEAD;
    proxy_cache_path /home/cache/test1/ keys_zone=zone1:10m inactive=100d max_size=1024m;

    lua_package_path "$prefixlua/?.so;;$prefixlua/module/?.so;$prefixlua/?.lua;$prefixlua/module/?.lua;;";
    lua_shared_dict ip_data 178m;

    server {
        listen *:8080 reuseport;
	
        set $cache_name "test_cache";
        set $site       "test_site";

        add_header X-Cache-Status $upstream_cache_status;
        proxy_ignore_headers Cache-Control Expires;

        location /test1 {
            access_by_lua_block {
                local is_handle_slice_or, handle_slice = pcall(require, 'resty.handle_slice')
                if not is_handle_slice_or then
                    ngx.log(ngx.ERR, 'need to build with nginx_http_slice module')
                    return 501
                end

                local ok, err = handle_slice.set_slice(10000);
                if not ok then 
                    ngx.log(ngx.ERR, 'failed to set slice size : ', err)
                    return 403
                end
                
                ngx.log(ngx.INFO, 'set slice size success')
            }
            proxy_pass           http://mirror01.idc.hinet.net/;
            proxy_cache          zone1;
            proxy_cache_key      $uri$is_args$args$slice_range;
            proxy_set_header     Range $slice_range;
            proxy_cache_valid    200 206  1h;
        }
        location /test2 {
            access_by_lua_block {
                local is_handle_slice_or, handle_slice = pcall(require, 'resty.handle_slice')
                if not is_handle_slice_or then
                    ngx.log(ngx.ERR, 'need to build with nginx_http_slice module')
                    return 501
                end

                local ok, err = handle_slice.set_slice(20000);
                if not ok then 
                    ngx.log(ngx.ERR, 'failed to set slice size : ', err)
                    return 403
                end
                
                ngx.log(ngx.INFO, 'set slice size success')
            }
            proxy_pass           http://mirror01.idc.hinet.net/;
            proxy_cache          zone1;
            proxy_cache_key      $uri$is_args$args$slice_range;
            proxy_set_header     Range $slice_range;
            proxy_cache_valid    200 206  1h;
        }
        location /test3 {
            proxy_pass           http://mirror01.idc.hinet.net/;
            proxy_cache          zone1;
            proxy_cache_key      $uri$is_args$args$slice_range;
            proxy_set_header     Range $slice_range;
            proxy_cache_valid    200 206  1h;
        }
    }
}
