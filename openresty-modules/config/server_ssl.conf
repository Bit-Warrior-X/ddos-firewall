ssl_certificate     /usr/local/share/dorian/athens/nginx/cert/fullchain.pem;
ssl_certificate_key /usr/local/share/dorian/athens/nginx/cert/privkey.pem;

ssl_certificate_by_lua_block {
    require("resty.ssl_cert").certificate()
}

http2 on;
http2_max_concurrent_streams 32;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_ecdh_curve X25519:prime256v1:secp384r1;
# Dynamic SNI certs (ssl_certificate_by_lua) are skipped on session resumption.
# Tickets + long-lived sessions would keep serving the previous cert until
# Athens restarts — disable tickets and keep sessions short so Redis updates apply.
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 5m;
ssl_session_tickets off;
ssl_buffer_size 4k;
