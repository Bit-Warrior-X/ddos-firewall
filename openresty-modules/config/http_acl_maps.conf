# HTTP-level maps and ACL log format (included from athens.conf).

# Initialize ACL variables at HTTP level to avoid uninitialized variable warnings
# Use map from $request_uri to initialize custom vars by default
map $request_uri $acl_blocked {
    default 0;
}
map $request_uri $acl_ret {
    default 0;
}
map $request_uri $acl_rule_id {
    default "-";
}
# WafRuleType / rule id of the blocking rule, and geo country (set by Lua for stats/logs).
map $request_uri $waf_rule_type {
    default "";
}
map $request_uri $waf_rule_id {
    default "";
}
map $request_uri $stats_country {
    default "";
}
# Requests rejected before the rewrite phase (malformed 400s) never run
# `set $site_id`; the map keeps the access log from reading it uninitialized.
map $request_uri $site_id {
    default "";
}

# ----------------------------------------
# ACL CONDITIONAL LOGGING FLAG
# ----------------------------------------
map $acl_blocked $log_acl {
    default 0;
    1       1;
}

# Dynamic backend set by Lua from Redis upstreamservers:{site_id}.
# Empty default — acl_access must set a real origin or exit 502.
# Never default to :9000 (internal stats "Welcome to Default Server").
map $request_uri $backend {
    default "";
}

# Cache keys are host-scoped; listen ports other than 80/443 can route to their
# own origin pool (originroutes), so they get their own key space. The
# "host:port" form matches the purge pattern built by Angelos l7_clear_url_cache.
map $server_port $cache_port_tag {
    80      "";
    443     "";
    default ":$server_port";
}

# Cache enable flag (set by resty.cache_manager)
map $cache_enabled $proxy_cache_bypass {
    default 1;
    1       0;
}

map $cache_enabled $proxy_no_cache {
    default 1;
    1       0;
}

# ----------------------------------------
# ACL LOG FORMAT (EXTENDED)
# ----------------------------------------
log_format acl_log
    '$remote_addr [$time_local] "$request" '
    'status=$status '
    'rule_id=$acl_rule_id '
    'acl_ret=$acl_ret '
    'ua="$http_user_agent"';
