# Prefer $prefix = OpenResty root (.../athens). Also accept nginx-subdir prefix
# (.../athens/nginx) used by some installs so resty modules under nginx/lua resolve.
lua_package_path "$prefix/nginx/lua/?.lua;$prefix/nginx/lua/?/init.lua;$prefix/lua/?.lua;$prefix/lua/?/init.lua;$prefix/lualib/?.lua;$prefix/lualib/?/init.lua;$prefix/../lualib/?.lua;$prefix/../lualib/?/init.lua;;";
lua_package_cpath "$prefix/nginx/lua/?.so;$prefix/lua/?.so;$prefix/lualib/?.so;$prefix/../lualib/?.so;;";

lua_socket_log_errors off;
lua_http10_buffering off;
lua_check_client_abort on;
lua_malloc_trim 1000;
lua_max_running_timers 256;
lua_max_pending_timers 1024;
