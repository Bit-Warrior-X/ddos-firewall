    server {
        listen 9000;
        location / { return 200 "Welcome to Default Server"; }

        # Endpoint to retrieve aggregated traffic statistics
        location /server_traffic_stats {
            content_by_lua_block {
                local stats_history = ngx.shared.stats_history
                local cjson = require "cjson"
                
                -- Get parameters
                local args = ngx.req.get_uri_args()
                local timestamp = args.timestamp
                local format = args.format or "json"
                
                if timestamp then
                    -- Get specific interval
                    local stats = stats_history:get(tostring(timestamp))
                    if stats then
                        ngx.say(stats)
                    else
                        ngx.status = ngx.HTTP_NOT_FOUND
                        ngx.say(cjson.encode({error = "No data for timestamp"}))
                    end
                else
                    -- Get latest stats (by highest timestamp key)
                    local keys = stats_history:get_keys(0)
                    if #keys > 0 then
                        table.sort(keys, function(a, b)
                            return tonumber(a) < tonumber(b)
                        end)
                        local latest_key = keys[#keys]
                        local latest = stats_history:get(latest_key)
                        ngx.say(latest)
                    else
                        ngx.say(cjson.encode({error = "No statistics available"}))
                    end
                end
            }
        }
        
        # Endpoint to retrieve per-IP request statistics over recent interval
        location /ip_request_stats {
            content_by_lua_block {
                local ip_stats_history = ngx.shared.ip_stats_history
                local stats_cache = ngx.shared.stats_cache
                local cjson = require "cjson"
                
                -- Get parameters (optional timestamp, same pattern as server_traffic_stats)
                local args = ngx.req.get_uri_args()
                local timestamp = args.timestamp

                if timestamp then
                    if not ip_stats_history then
                        ngx.status = ngx.HTTP_INTERNAL_SERVER_ERROR
                        ngx.say(cjson.encode({ error = "ip_stats_history shared dict not available" }))
                        return
                    end

                    -- Get specific completed interval from history
                    local stats = ip_stats_history:get(tostring(timestamp))
                    if stats then
                        ngx.header.content_type = "application/json"
                        ngx.say(stats)
                    else
                        ngx.status = ngx.HTTP_NOT_FOUND
                        ngx.header.content_type = "application/json"
                        ngx.say(cjson.encode({ error = "No ip_request_stats data for timestamp" }))
                    end
                    return
                end

                -- No timestamp parameter: return live snapshot for current interval
                local interval = 60
                if stats_cache then
                    interval = stats_cache:get("STATS_INTERVAL") or interval
                end

                local current_time = ngx.now()
                local current_bucket = math.floor(current_time / interval) * interval

                local items = {}
                if stats_cache then
                    local keys = stats_cache:get_keys(0)
                    for _, key in ipairs(keys) do
                        local ip = key:match("^ip_req_count:(.+)$")
                        if ip then
                            local count = stats_cache:get(key) or 0
                            if count and count > 0 then
                                table.insert(items, {
                                    ip = ip,
                                    request_count = count,
                                })
                            end
                        end
                    end
                end

                table.sort(items, function(a, b)
                    return a.ip < b.ip
                end)

                ngx.header.content_type = "application/json"
                ngx.say(cjson.encode({
                    timestamp = current_bucket,
                    ip_request_stats = items,
                }))
            }
        }

