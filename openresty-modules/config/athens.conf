        # Endpoint to get list of available timestamps for L4 attack statistics
        location /l4_attack_stats/timestamps {
            content_by_lua_block {
                local cjson = require "cjson"

                local function run_cli(cmd)
                    local handle, err = io.popen(cmd .. " 2>&1", "r")
                    if not handle then
                        ngx.status = ngx.HTTP_INTERNAL_SERVER_ERROR
                        ngx.header.content_type = "application/json"
                        ngx.say(cjson.encode({ error = "failed to run sparta_cli", details = err }))
                        return nil
                    end

                    local output = handle:read("*a") or ""
                    handle:close()

                    if not output:find("ok") then
                        ngx.status = ngx.HTTP_INTERNAL_SERVER_ERROR
                        ngx.header.content_type = "application/json"
                        ngx.say(cjson.encode({ error = "sparta_cli returned error", details = output }))
                        return nil
                    end

                    return output
                end

                local output = run_cli("sparta_cli TRAFFIC_TIMESTAMPS")
                if not output then
                    return
                end

                local timestamps = {}
                for ts in output:gmatch("(%d+)") do
                    table.insert(timestamps, tonumber(ts))
                end

                table.sort(timestamps)

                ngx.header.content_type = "application/json"
                ngx.say(cjson.encode(timestamps))
            }
        }

        # Endpoint to retrieve L4 attack statistics for a given timestamp (or latest if not provided)
        location /l4_attack_stats {
            content_by_lua_block {
                local cjson = require "cjson"

                local function run_cli(cmd)
                    local handle, err = io.popen(cmd .. " 2>&1", "r")
                    if not handle then
                        ngx.status = ngx.HTTP_INTERNAL_SERVER_ERROR
                        ngx.header.content_type = "application/json"
                        ngx.say(cjson.encode({ error = "failed to run sparta_cli", details = err }))
                        return nil
                    end

                    local output = handle:read("*a") or ""
                    handle:close()

                    if not output:find("ok") then
                        ngx.status = ngx.HTTP_INTERNAL_SERVER_ERROR
                        ngx.header.content_type = "application/json"
                        ngx.say(cjson.encode({ error = "sparta_cli returned error", details = output }))
                        return nil
                    end

                    return output
                end

                local args = ngx.req.get_uri_args()
                local timestamp = args.timestamp

                local function get_latest_timestamp()
                    local output = run_cli("sparta_cli TRAFFIC_TIMESTAMPS")
                    if not output then
                        return nil
                    end

                    local latest = nil
                    for ts in output:gmatch("(%d+)") do
                        local num = tonumber(ts)
                        if num and (not latest or num > latest) then
                            latest = num
                        end
                    end

                    return latest
                end

                if timestamp and tostring(timestamp) ~= "" then
                    if not tostring(timestamp):match("^%d+$") then
                        ngx.status = ngx.HTTP_BAD_REQUEST
                        ngx.header.content_type = "application/json"
                        ngx.say(cjson.encode({ error = "invalid timestamp parameter" }))
                        return
                    end
                else
                    local latest = get_latest_timestamp()
                    if not latest then
                        ngx.status = ngx.HTTP_NOT_FOUND
                        ngx.header.content_type = "application/json"
                        ngx.say(cjson.encode({ error = "no L4 attack statistics available" }))
                        return
                    end
                    timestamp = tostring(latest)
                end

                local output = run_cli("sparta_cli TRAFFIC_STATS " .. timestamp)
                if not output then
                    return
                end

                local stats_line = nil
                for line in output:gmatch("([^\r\n]+)") do
                    if line ~= "" and line ~= "ok" then
                        stats_line = line
                    end
                end

                if not stats_line then
                    ngx.status = ngx.HTTP_INTERNAL_SERVER_ERROR
                    ngx.header.content_type = "application/json"
                    ngx.say(cjson.encode({ error = "no stats returned from sparta_cli" }))
                    return
                end

                local stats = {}
                for key, value in stats_line:gmatch("(%w+):(%d+)") do
                    stats[key] = tonumber(value)
                end

                ngx.header.content_type = "application/json"
                ngx.say(cjson.encode({
                    timestamp = tonumber(timestamp),
                    stats = stats,
                }))
            }
        }
    }
}