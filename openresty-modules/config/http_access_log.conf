# Raw per-request log for GET /access_logs (resty.access_logs reshapes each line).
# Hourly files are named after the local hour of $time_iso8601; Lua prunes them after 8 days.
# msec must stay the first field: access_logs filters lines by it without decoding.

map $time_iso8601 $access_log_hour {
    "~^(?<hour>\d{4}-\d{2}-\d{2}T\d{2})" $hour;
    default "unknown";
}

log_format access_ndjson escape=json
    '{"msec":"$msec",'
    '"request_id":"$request_id",'
    '"site_id":"$site_id",'
    '"client_ip":"$remote_addr",'
    '"country_iso":"$stats_country",'
    '"method":"$request_method",'
    '"scheme":"$scheme",'
    '"host":"$host",'
    '"uri":"$request_uri",'
    '"protocol":"$server_protocol",'
    '"status":"$status",'
    '"bytes_sent":"$bytes_sent",'
    '"request_length":"$request_length",'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent",'
    '"content_type":"$sent_http_content_type",'
    '"cache_status":"$upstream_cache_status",'
    '"request_time":"$request_time",'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_header_time":"$upstream_header_time",'
    '"upstream_response_time":"$upstream_response_time",'
    '"upstream_bytes_received":"$upstream_bytes_received",'
    '"blocked":"$acl_blocked",'
    '"rule_type":"$waf_rule_type",'
    '"rule_id":"$waf_rule_id"}';
