# Lua shared dictionaries for ACL, upstreams, and statistics (included from athens.conf).

# mlcache shared dicts
lua_shared_dict acl_cache 20m;
lua_shared_dict acl_init_state 1m;
lua_shared_dict ipc_shared_dict 10m;
lua_shared_dict upstream_servers 1m;
lua_shared_dict cache_rules 2m;
lua_socket_log_errors off;

# Shared dictionaries for statistics
lua_shared_dict stats_cache 100m;
lua_shared_dict stats_history 200m;
lua_shared_dict ip_stats_history 200m;
lua_shared_dict url_stats_history 200m;
lua_shared_dict useragent_stats_history 200m;
lua_shared_dict country_stats_history 200m;
lua_shared_dict isp_stats_history 200m;
lua_shared_dict referer_stats_history 200m;
