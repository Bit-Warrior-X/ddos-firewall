sendfile on;
tcp_nopush on;
tcp_nodelay on;
reset_timedout_connection on;
aio threads;

keepalive_timeout 30;
keepalive_requests 10000;
client_header_timeout 12s;
# Large L4 temp-blacklist sync POSTs (~2.5k IPs / ~300KB+) must stay in
# memory; 128k caused per-minute client_body disk spill under panel sync.
client_body_timeout 60s;
send_timeout 30s;
client_header_buffer_size 1k;
large_client_header_buffers 4 8k;
client_body_buffer_size 2m;
client_max_body_size 32m;

types_hash_max_size 2048;
types_hash_bucket_size 128;
variables_hash_max_size 2048;
server_tokens off;
absolute_redirect off;

open_file_cache max=20000 inactive=20s;
open_file_cache_valid 30s;
open_file_cache_min_uses 2;
open_file_cache_errors on;

resolver 8.8.8.8 1.1.1.1 valid=30s ipv6=off;
resolver_timeout 2s;

include /usr/local/share/dorian/athens/nginx/conf/mime.types;
default_type application/octet-stream;
include http_gzip.conf;

log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$host"';
