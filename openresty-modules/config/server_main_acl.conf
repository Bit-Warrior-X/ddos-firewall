# ============================================================
# MAIN ACL PROTECTED SERVER
# Dynamic SNI certificates via ssl_certificate_by_lua (ssl:{site_id}).
# Default PEM paths remain as handshake fallback when no site cert exists.
# ============================================================
server {
    include server_default_ports.conf;

    # Catch-all so any Host/SNI is handled here; cert is chosen in Lua.
    server_name _;

    include server_ssl.conf;

    # Declare ACL logging variables (must be before access_log directives)
    set $acl_blocked 0;
    set $acl_rule_id -;
    set $waf_rule_type "";
    set $waf_rule_id "";
    set $stats_country "";
    set $site_id "";
    # Ensure $backend is assignable from Lua (map alone can be sticky).
    set $backend "";
    set $cache_enabled 0;
    set $cache_key_uri $uri$is_args$args;
    set $cache_rule_name "";
    set $cache_slice_size 0;
    set $cache_inactive_ttl 0;

    access_log /tmp/on main buffer=512k flush=5s;
    access_log /tmp/acl_log acl_log if=$log_acl;
    access_log /usr/local/share/dorian/athens/nginx/logs/access/access-$access_log_hour.ndjson access_ndjson;
    open_log_file_cache max=16 inactive=2m valid=1m min_uses=1;

    include server_acl.conf;

    # Requests rejected before location matching (malformed request line /
    # headers, 400/408) only reach this server-level log phase. Locations
    # below override it with location_log_response.conf.
    log_by_lua_block {
        require("resty.l7_guard").log()
    }

    # Count bytes sent per Host for ngx_req_status (/req-status).
    req_status host;

    location / {
        limit_req zone=l7_perip burst=200 nodelay;
        limit_conn l7_conn 100;

        access_by_lua_block {
            local request_stats = require "resty.request_stats"
            local acl_access = require "resty.acl_access"
            local cache_manager = require "resty.cache_manager"
            request_stats.track_request()
            acl_access.run()
            cache_manager.apply()
        }

        include location_log_response.conf;

        # Used when no cache rule matches (cache_manager.apply does not exec).
        include location_proxy_nocache.conf;
    }

    location @proxy_cache_origin {
        include location_log_response.conf;
        include location_cache_headers.conf;
        include location_proxy_origin.conf;
    }

    location @proxy_cache_origin_slice {
        access_by_lua_block {
            require("resty.cache_manager").setup_slice()
        }

        include location_log_response.conf;
        include location_cache_headers.conf;
        include location_proxy_origin_slice.conf;
    }

    location @proxy_cache_force {
        include location_log_response.conf;
        include location_cache_headers.conf;
        include location_proxy_force.conf;
    }

    location @proxy_cache_force_slice {
        access_by_lua_block {
            require("resty.cache_manager").setup_slice()
        }

        include location_log_response.conf;
        include location_cache_headers.conf;
        include location_proxy_force_slice.conf;
    }
}
