# ============================================================
# MAIN ACL PROTECTED SERVER
# ============================================================
server {
    include server_default_ports.conf;

    server_name example.com;

    ssl_certificate     /usr/local/share/dorian/athens/nginx/cert/fullchain.pem;
    ssl_certificate_key /usr/local/share/dorian/athens/nginx/cert/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    ssl_prefer_server_ciphers on;
    
    # Declare ACL logging variables (must be before access_log directives)
    set $acl_blocked 0;
    set $acl_rule_id -;
    set $cache_enabled 0;
    set $cache_key_uri $uri$is_args$args;
    set $cache_rule_name "";
    set $cache_slice_size 0;
    set $cache_inactive_ttl 0;

    access_log /tmp/on main;
    access_log /tmp/acl_log acl_log if=$log_acl;

    include server_acl.conf;

    location / {
        access_by_lua_block {
            local request_stats = require "resty.request_stats"
            local acl_access = require "resty.acl_access"
            local cache_manager = require "resty.cache_manager"
            request_stats.track_request()
            acl_access.run()
            cache_manager.apply()
        }

        log_by_lua_block {
            require("resty.request_stats").log_response()
        }

        # Used when no cache rule matches (cache_manager.apply does not exec).
        include location_proxy_nocache.conf;
    }

    location @proxy_cache_origin {
        log_by_lua_block {
            require("resty.request_stats").log_response()
        }

        header_filter_by_lua_block {
            require("resty.cache_manager").set_cache_headers()
        }

        include location_proxy_origin.conf;
    }

    location @proxy_cache_origin_slice {
        access_by_lua_block {
            require("resty.cache_manager").setup_slice()
        }

        log_by_lua_block {
            require("resty.request_stats").log_response()
        }

        header_filter_by_lua_block {
            require("resty.cache_manager").set_cache_headers()
        }

        include location_proxy_origin_slice.conf;
    }

    location @proxy_cache_force {
        log_by_lua_block {
            require("resty.request_stats").log_response()
        }

        header_filter_by_lua_block {
            require("resty.cache_manager").set_cache_headers()
        }

        include location_proxy_force.conf;
    }

    location @proxy_cache_force_slice {
        access_by_lua_block {
            require("resty.cache_manager").setup_slice()
        }

        log_by_lua_block {
            require("resty.request_stats").log_response()
        }

        header_filter_by_lua_block {
            require("resty.cache_manager").set_cache_headers()
        }

        include location_proxy_force_slice.conf;
    }
}
