include header.conf;

pid /var/run/l7_firewall.pid;
env PUBKEY_PATH;
env LICENSE_PATH;

http {

    # Initialize ACL variables at HTTP level to avoid uninitialized variable warnings
    # Use map from $request_uri to initialize custom vars by default
    map $request_uri $acl_blocked {
        default 0;
    }
    map $request_uri $acl_ret {
        default 0;
    }
    map $request_uri $acl_rule_id {
        default "-";
    }

    # ----------------------------------------
    # ACL CONDITIONAL LOGGING FLAG
    # ----------------------------------------
    map $acl_blocked $log_acl {
        default 0;
        1       1;
    }

    # Default dynamic backend (overwritten by Lua from Redis upstreamservers)
    map $request_uri $backend {
        default "http://127.0.0.1:9000";
    }

    # ----------------------------------------
    # ACL LOG FORMAT (EXTENDED)
    # ----------------------------------------
    log_format acl_log
        '$remote_addr [$time_local] "$request" '
        'status=$status '
        'rule_id=$acl_rule_id '
        'acl_ret=$acl_ret '
        'ua="$http_user_agent"';

    include http_base_header.conf;
    #include http_report_ip.conf;
    include http_lua_header.conf;
    include http_lua_acl.conf;
    include backend_list.conf;

    # mlcache shared dicts
    lua_shared_dict acl_cache 20m;
    lua_shared_dict acl_init_state 1m;
    lua_shared_dict ipc_shared_dict 10m;
    lua_shared_dict upstream_servers 1m;
    lua_socket_log_errors off;

    # Shared dictionaries for statistics
    lua_shared_dict stats_cache 10m;
    lua_shared_dict stats_history 50m;

    # ----------------------------------------
    # WORKER INIT
    # ----------------------------------------
    init_worker_by_lua_block {
        local ok, acl_manager = pcall(require, 'resty.acl_manager')
        if not ok then
            ngx.log(ngx.ERR, "failed to require resty.acl_manager: ", tostring(acl_manager))
            return
        end

        -- initialize mlcache and loaders
        local ok_init, err_init = acl_manager.init()
        if not ok_init then
            ngx.log(ngx.ERR, "acl_manager.init() failed: ", tostring(err_init))
        end

        -- Start Redis subscriber in background
        local ok_timer, err_timer = ngx.timer.at(0, function(premature)
            if premature then return end
            acl_manager.start_redis_subscriber()
        end)
        if not ok_timer then
            ngx.log(ngx.ERR, "failed to start redis subscriber timer: ", tostring(err_timer))
        end

        -- Primary initial load
        ngx.timer.at(0.1, function(premature)
            if premature then return end
            local ok_load, err_load = acl_manager.load_all_rules()
            if not ok_load then
                ngx.log(ngx.ERR, "initial load_all_rules failed: ", tostring(err_load))
            else
                ngx.log(ngx.INFO, "initial load_all_rules success")
            end
        end)

        -- Dynamic upstreams from Redis key "upstreamservers"
        local ok_ur, upstream_redis = pcall(require, "resty.upstream_redis")
        if ok_ur and upstream_redis and upstream_redis.start_refresh then
            upstream_redis.start_refresh()
        end

        -- Initialize MaxMind DB for geolocation (used by temporary blacklist)
        local ok_mm, maxminddb = pcall(require, "resty.maxminddb")
        if ok_mm and maxminddb and maxminddb.init then
            local geo_path = "/usr/local/openresty/nginx/lua/geoip2/city.mmdb"
            local ok_geo, err_geo = maxminddb.init(geo_path)
            if not ok_geo then
                ngx.log(ngx.WARN, "maxminddb.init failed (temporary blacklist geo will be empty): ", tostring(err_geo))
            end
        end

        -- NIC detection and statistics (from /usr/local/share/ebpf_firewall/firewall.config)
        local firewall_config_path = "/usr/local/share/ebpf_firewall/firewall.config"
        local nic_dev
        local last_nic_rx_bytes
        local last_nic_tx_bytes
        local STATS_INTERVAL = 60 -- 1 minutes in seconds

        local function detect_nic_dev()
            if nic_dev then
                return nic_dev
            end

            local f, err = io.open(firewall_config_path, "r")
            if not f then
                ngx.log(ngx.WARN, "failed to open firewall.config: ", tostring(err))
                return nil
            end

            for line in f:lines() do
                local dev = line:match("^%s*dev%s*=%s*(%S+)")
                if dev then
                    nic_dev = dev
                    break
                end
            end
            f:close()

            if not nic_dev then
                ngx.log(ngx.WARN, "no dev=... found in firewall.config")
            else
                ngx.log(ngx.INFO, "detected NIC dev from firewall.config: ", nic_dev)
            end

            return nic_dev
        end

        local function read_nic_bytes(dev)
            if not dev or dev == "" then
                return nil, nil
            end

            local base = "/sys/class/net/" .. dev .. "/statistics/"

            local function read_counter(name)
                local path = base .. name
                local f = io.open(path, "r")
                if not f then
                    return nil
                end
                local v = f:read("*l")
                f:close()
                return tonumber(v)
            end

            local rx = read_counter("rx_bytes")
            local tx = read_counter("tx_bytes")
            return rx, tx
        end

        local function collect_stats(premature)
            if premature then return end
            -- Initialize statistics caches
            local stats_cache = ngx.shared.stats_cache
            local stats_history = ngx.shared.stats_history

            -- Get current timestamp (rounded to the stats interval)
            local current_time = ngx.now()
            local interval = STATS_INTERVAL
            local timestamp = math.floor(current_time / interval) * interval

            -- NIC traffic and bandwidth over the last 5 minutes
            local nic_rx_delta = 0
            local nic_tx_delta = 0

            local dev = detect_nic_dev()
            if dev then
                local cur_rx, cur_tx = read_nic_bytes(dev)
                if cur_rx and cur_tx then
                    if last_nic_rx_bytes and last_nic_tx_bytes then
                        if cur_rx >= last_nic_rx_bytes then
                            nic_rx_delta = cur_rx - last_nic_rx_bytes
                        end
                        if cur_tx >= last_nic_tx_bytes then
                            nic_tx_delta = cur_tx - last_nic_tx_bytes
                        end
                    end
                    last_nic_rx_bytes = cur_rx
                    last_nic_tx_bytes = cur_tx
                end
            end

            -- Collect all statistics
            -- Normalize L7 bandwidth over the 5-minute interval
            local bandwidth_l7_rx_total = tonumber(stats_cache:get("bandwidth_l7_rx")) or 0
            local bandwidth_l7_tx_total = tonumber(stats_cache:get("bandwidth_l7_tx")) or 0
            local bandwidth_l7_rx_per_interval = bandwidth_l7_rx_total * 8 / interval
            local bandwidth_l7_tx_per_interval = bandwidth_l7_tx_total * 8 / interval

            -- Normalize NIC bandwidth over the 5-minute interval
            local bandwidth_nic_rx_per_interval = nic_rx_delta * 8 / interval
            local bandwidth_nic_tx_per_interval = nic_tx_delta * 8 / interval

            local stats = {
                timestamp = timestamp,
                traffic_nic_rx = nic_rx_delta,
                traffic_nic_tx = nic_tx_delta,
                traffic_l7_rx = stats_cache:get("traffic_l7_rx") or 0,
                traffic_l7_tx = stats_cache:get("traffic_l7_tx") or 0,
                bandwidth_nic_rx = bandwidth_nic_rx_per_interval,
                bandwidth_nic_tx = bandwidth_nic_tx_per_interval,
                bandwidth_l7_rx = bandwidth_l7_rx_per_interval,
                bandwidth_l7_tx = bandwidth_l7_tx_per_interval,
                request_count = stats_cache:get("request_count") or 0,
                response_count = stats_cache:get("response_count") or 0,
                blocked_request_count = stats_cache:get("blocked_request_count") or 0,
                ip_count = stats_cache:get("ip_count") or 0,
                blocked_ip_count = stats_cache:get("blocked_ip_count") or 0,
                
                -- Status codes
                code200 = stats_cache:get("code200") or 0,
                code206 = stats_cache:get("code206") or 0,
                code301 = stats_cache:get("code301") or 0,
                code302 = stats_cache:get("code302") or 0,
                code400 = stats_cache:get("code400") or 0,
                code403 = stats_cache:get("code403") or 0,
                code404 = stats_cache:get("code404") or 0,
                code444 = stats_cache:get("code444") or 0,
                code499 = stats_cache:get("code499") or 0,
                code500 = stats_cache:get("code500") or 0,
                code501 = stats_cache:get("code501") or 0,
                code502 = stats_cache:get("code502") or 0,
                code503 = stats_cache:get("code503") or 0,
                code504 = stats_cache:get("code504") or 0,
                code904 = stats_cache:get("code904") or 0,
                code929 = stats_cache:get("code929") or 0,
                code978 = stats_cache:get("code978") or 0,
                
                -- HTTP methods
                get_count = stats_cache:get("get_count") or 0,
                post_count = stats_cache:get("post_count") or 0,
                delete_count = stats_cache:get("delete_count") or 0,
                put_count = stats_cache:get("put_count") or 0,
                head_count = stats_cache:get("head_count") or 0,
                patch_count = stats_cache:get("patch_count") or 0,
                options_count = stats_cache:get("options_count") or 0,
                others_count = stats_cache:get("others_count") or 0,
                
                -- HTTP versions
                http1_0_count = stats_cache:get("http1_0_count") or 0,
                http1_1_count = stats_cache:get("http1_1_count") or 0,
                http2_count = stats_cache:get("http2_count") or 0,
                http3_count = stats_cache:get("http3_count") or 0,
            }

            -- Store in history with timestamp
            local ok_j, cjson = pcall(require, "cjson.safe")
            if ok_j and cjson and cjson.encode then
                stats_history:set(tostring(timestamp), cjson.encode(stats))
            end
            
            -- Reset counters for next interval
            stats_cache:set("traffic_nic_rx", 0)
            stats_cache:set("traffic_nic_tx", 0)
            stats_cache:set("traffic_l7_rx", 0)
            stats_cache:set("traffic_l7_tx", 0)
            stats_cache:set("bandwidth_nic_rx", 0)
            stats_cache:set("bandwidth_nic_tx", 0)
            stats_cache:set("bandwidth_l7_rx", 0)
            stats_cache:set("bandwidth_l7_tx", 0)
            stats_cache:set("request_count", 0)
            stats_cache:set("response_count", 0)
            stats_cache:set("blocked_request_count", 0)
            stats_cache:set("ip_count", 0)
            stats_cache:set("blocked_ip_count", 0)

            -- Reset status codes
            for _, code in ipairs({200,206,301,302,400,403,404,444,499,500,501,502,503,504,904,929,978}) do
                stats_cache:set("code" .. code, 0)
            end

            -- Reset methods
            for _, method in ipairs({"get","post","delete","put","head","patch","options","others"}) do
                stats_cache:set(method .. "_count", 0)
            end
            
            -- Reset HTTP versions
            stats_cache:set("http1_0_count", 0)
            stats_cache:set("http1_1_count", 0)
            stats_cache:set("http2_count", 0)
            stats_cache:set("http3_count", 0)

            -- Clean old history
            local last_count = tonumber(24 * 3600 / STATS_INTERVAL) + 1 or 300
            local keys = stats_history:get_keys(last_count)
            local cutoff = current_time - (24 * 3600)
            for _, key in ipairs(keys) do
                local ts = tonumber(key)
                if ts and ts < cutoff then
                    stats_history:delete(key)
                end
            end
        end
        -- Schedule the collection every STATS_INTERVAL seconds
        local ok, err = ngx.timer.every(STATS_INTERVAL, collect_stats)
        if not ok then
            ngx.log(ngx.ERR, "Failed to create timer: ", err)
        end
    }

    # ============================================================
    # MAIN ACL PROTECTED SERVER
    # ============================================================
    server {
        include server_default_ports.conf;

        # Declare ACL logging variables (must be before access_log directives)
        set $acl_blocked 0;
        set $acl_rule_id -;

        access_log /tmp/on main;
        access_log /tmp/acl_log acl_log if=$log_acl;

        include server_acl.conf;

        location / {
            log_by_lua_block {
                local stats_cache = ngx.shared.stats_cache
                
                -- Track bandwidth (response size)
                local response_size = tonumber(ngx.var.bytes_sent) or 0
                stats_cache:incr("bandwidth_l7_tx", response_size, 0)
                stats_cache:incr("traffic_l7_tx", response_size, 0)

                -- Track response count and status code
                stats_cache:incr("response_count", 1, 0)
                local status = ngx.status
                local status_key = "code" .. status
                stats_cache:incr(status_key, 1, 0)

                -- Track HTTP method
                local method = ngx.var.request_method
                if method == "GET" then
                    stats_cache:incr("get_count", 1, 0)
                elseif method == "POST" then
                    stats_cache:incr("post_count", 1, 0)
                elseif method == "DELETE" then
                    stats_cache:incr("delete_count", 1, 0)
                elseif method == "PUT" then
                    stats_cache:incr("put_count", 1, 0)
                elseif method == "HEAD" then
                    stats_cache:incr("head_count", 1, 0)
                elseif method == "PATCH" then
                    stats_cache:incr("patch_count", 1, 0)
                elseif method == "OPTIONS" then
                    stats_cache:incr("options_count", 1, 0)
                else
                    stats_cache:incr("others_count", 1, 0)
                end

                -- Track HTTP version (from server_protocol)
                local proto = ngx.var.server_protocol or ""
                if proto == "HTTP/1.0" then
                    stats_cache:incr("http1_0_count", 1, 0)
                elseif proto == "HTTP/1.1" then
                    stats_cache:incr("http1_1_count", 1, 0)
                elseif proto:sub(1, 6) == "HTTP/2" then
                    stats_cache:incr("http2_count", 1, 0)
                elseif proto:sub(1, 6) == "HTTP/3" then
                    stats_cache:incr("http3_count", 1, 0)
                else
                    -- treat unknown / future versions as HTTP/1.1 for counting purposes
                    stats_cache:incr("http1_1_count", 1, 0)
                end
            }

            access_by_lua_block {
                local interval = 300

                -- Collect statistics for the current request
                local stats_cache = ngx.shared.stats_cache
                -- Increment request count
                stats_cache:incr("request_count", 1, 0)

                -- Track traffic (request size)
                local request_size = tonumber(ngx.var.request_length) or 0
                stats_cache:incr("traffic_l7_rx", request_size, 0)
                stats_cache:incr("bandwidth_l7_rx", request_size, 0)

                 -- Track IP addresses
                local ip = ngx.var.remote_addr
                local ip_key = "ip:" .. ip
                if not stats_cache:get(ip_key) then
                    stats_cache:set(ip_key, true, interval) -- Expire after interval
                    stats_cache:incr("ip_count", 1, 0)
                end

                -- numeric return codes from `acl_rule_return_e` in
                -- `ngx_http_acl_module_type.h`
                local ACL_RETURN_INTERNAL_ERROR = 0
                local ACL_RETURN_ALLOW_RULE     = 1
                local ACL_RETURN_DROP           = 2
                local ACL_RETURN_DENY           = 3
                local ACL_RETURN_DROP_BLOCK     = 4
                local ACL_RETURN_CAPTCHA_START  = 5
                local ACL_RETURN_ALLOW_NO_RULE  = 6
                local ACL_RETURN_NO_LICENSE     = 7

                local RULE_NAMES = {
                    [1] = "whitelist",
                    [2] = "blacklist",
                    [3] = "geo",
                    [4] = "antiheader",
                    [5] = "intervalfreqlimit",
                    [6] = "secondaryfreqlimit",
                    [7] = "responsefreq",
                    [8] = "useragent",
                }

                -- Check temporaryblacklist in Redis for this IP and URI.
                -- Keys: temporaryblacklist:<ip>:<blocked_at>, value: JSON with at least { ip, url, ... }.
                -- If any key for this IP has a 'url' regex that matches current request_uri, we will:
                --   - mark it as blocked with rule name "temporaryblacklist"
                --   - immediately return 444.
                local function check_temporaryblacklist()
                    local ip = ngx.var.remote_addr
                    if not ip or ip == "" then
                        return false
                    end

                    local uri = ngx.var.request_uri or ngx.var.uri or ""

                    local ok_r, redis = pcall(require, "resty.redis")
                    local ok_j, cjson = pcall(require, "cjson.safe")
                    if not ok_r or not redis or not ok_j or not cjson then
                        return false
                    end

                    local red = redis:new()
                    red:set_timeout(1000)
                    local ok_conn, err_conn = red:connect("unix:/tmp/redis.sock")
                    if not ok_conn then
                        return false
                    end

                    local cursor = "0"
                    local pattern = "temporaryblacklist:" .. ip .. ":*"
                    repeat
                        local res, err = red:scan(cursor, "MATCH", pattern, "COUNT", 20)
                        if not res or err then
                            break
                        end
                        cursor = res[1]
                        local keys = res[2]
                        if keys and #keys > 0 then
                            for _, key in ipairs(keys) do
                                local raw, gerr = red:get(key)
                                if raw and raw ~= ngx.null and raw ~= "" then
                                    local item = cjson.decode(raw)
                                    if item and type(item) == "table" then
                                        local url_pat = item.url or ""
                                        if url_pat ~= "" then
                                            local ok_re, m = pcall(ngx.re.find, uri, url_pat, "jo")
                                            if ok_re and m then
                                                -- Mark for logging: rule name "temporaryblacklist"
                                                ngx.var.acl_blocked = 1
                                                ngx.var.acl_rule_id = "temporaryblacklist"
                                                ngx.var.acl_ret     = "temporaryblacklist"
                                                red:set_keepalive(10000, 100)
                                                return true
                                            end
                                        end
                                    end
                                end
                            end
                        end
                    until cursor == "0"

                    red:set_keepalive(10000, 100)
                    return false
                end

                -- Reset per-request variables
                ngx.var.acl_blocked  = 0
                ngx.var.acl_ret      = "0"
                ngx.var.acl_rule_id  = "-"

                -- Check temporary blacklist first: if current IP and URI match an entry, drop immediately.
                local bl_hit = check_temporaryblacklist()
                if bl_hit then
                    stats_cache:incr("blocked_request_count", 1, 0)
                    local ip = ngx.var.remote_addr
                    local blcoked_ip_key = "blocked_ip:" .. ip
                    if not stats_cache:get(blcoked_ip_key) then
                        stats_cache:set(blcoked_ip_key, true, interval) -- Expire after interval
                        stats_cache:incr("blocked_ip_count", 1, 0)
                    end
                    return ngx.exit(444)
                end

                local handle_acl = require "resty.handle_acl"

                local function mark_block(rule_id, ret, action)
                    ngx.var.acl_blocked = 1
                    ngx.var.acl_rule_id = RULE_NAMES[rule_id] or tostring(rule_id)
                    ngx.var.acl_ret     = action

                    stats_cache:incr("blocked_request_count", 1, 0)

                    local ip = ngx.var.remote_addr
                    local blcoked_ip_key = "blocked_ip:" .. ip
                    if not stats_cache:get(blcoked_ip_key) then
                        stats_cache:set(blcoked_ip_key, true, interval) -- Expire after interval
                        stats_cache:incr("blocked_ip_count", 1, 0)
                    end
                    
                    if action == "drop_block" then
                        local DEFAULT_TTL = 180  -- 3 minutes
                        local ip = ngx.var.remote_addr or ""
                        local url = ngx.var.request_uri or ngx.var.uri or ""
                        local blocked_at = tostring(ngx.time())
                        local trigger_rule = RULE_NAMES[rule_id] or tostring(rule_id)

                        local country = "-"
                        local province = "-"
                        local ok_mm, maxminddb = pcall(require, "resty.maxminddb")
                        if ok_mm and maxminddb and maxminddb.initted and maxminddb.initted() then
                            local c, _ = maxminddb.lookup_iso_code(ip)
                            if c and c ~= "" then country = c end
                            local p, _ = maxminddb.lookup_province(ip)
                            if p and p ~= "" then province = p end
                        end

                        local ok_r, redis = pcall(require, "resty.redis")
                        local ok_j, cjson = pcall(require, "cjson.safe")
                        if ok_r and redis and ok_j and cjson and ip ~= "" then
                            local red = redis:new()
                            red:set_timeout(2000)
                            local ok_conn, err_conn = red:connect("unix:/tmp/redis.sock")
                            if ok_conn then
                                local entry = {
                                    ip = ip,
                                    url = url,
                                    country = country,
                                    province = province,
                                    blocked_at = blocked_at,
                                    ttl = DEFAULT_TTL,
                                    trigger_rule = trigger_rule,
                                }
                                local json_str = cjson.encode(entry)
                                if json_str then
                                    local item_key = "temporaryblacklist:" .. ip .. ":" .. blocked_at
                                    red:set(item_key, json_str)
                                    red:expire(item_key, DEFAULT_TTL)
                                    red:publish("temporaryblacklist:added", json_str)
                                    ngx.log(ngx.INFO, "temporaryblacklist:added published: ", json_str)
                                end
                                red:set_keepalive(10000, 100)
                            else
                                ngx.log(ngx.ERR, "temporaryblacklist redis connect failed: ", tostring(err_conn))
                            end
                        end
                    end
                end

                local function handle_result(rule_id, ret)
                    if ret == ACL_RETURN_ALLOW_RULE then
                        return true
                    elseif ret == ACL_RETURN_INTERNAL_ERROR
                        or ret == ACL_RETURN_NO_LICENSE
                    then
                        mark_block(rule_id, ret, "internal_error")
                        return ngx.exit(501)
                    elseif ret == ACL_RETURN_DROP then
                        mark_block(rule_id, ret, "drop")
                        return ngx.exit(444)
                    elseif ret == ACL_RETURN_DROP_BLOCK then
                        mark_block(rule_id, ret, "drop_block")
                        return ngx.exit(444)
                    elseif ret == ACL_RETURN_DENY then
                        mark_block(rule_id, ret, "deny")
                        return ngx.exit(403)
                    elseif ret == ACL_RETURN_CAPTCHA_START then
                        mark_block(rule_id, ret, "captcha_start")
                        return ngx.exit(403)
                    elseif ret == ACL_RETURN_ALLOW_NO_RULE then
                        return "no_rule"
                    else
                        mark_block(rule_id, ret, "unknown")
                        return ngx.exit(501)
                    end
                end

                -- 1: whitelist
                local ret = handle_acl.process_acl_id(1)
                local res = handle_result(1, ret)
                if res ~= "no_rule" then
                    return
                end

                -- 2: blacklist
                ret = handle_acl.process_acl_id(2)
                res = handle_result(2, ret)
                if res ~= "no_rule" then
                    return
                end

                -- 3: geo
                ret = handle_acl.process_acl_id(3)
                res = handle_result(3, ret)
                if res ~= "no_rule" then
                    return
                end

                -- 4: antiheader
                ret = handle_acl.process_acl_id(4)
                res = handle_result(4, ret)
                if res ~= "no_rule" then
                    return
                end
                -- 5: intervalfreqlimit
                ret = handle_acl.process_acl_id(5)
                res = handle_result(5, ret)
                if res ~= "no_rule" then
                    return
                end
                -- 6: secondaryfreqlimit
                ret = handle_acl.process_acl_id(6)
                res = handle_result(6, ret)
                if res ~= "no_rule" then
                    return
                end
                -- 7: responsefreq
                ret = handle_acl.process_acl_id(7)
                res = handle_result(7, ret)
                if res ~= "no_rule" then
                    return
                end
                -- 8: useragent
                ret = handle_acl.process_acl_id(8)
                res = handle_result(8, ret)
                if res ~= "no_rule" then
                    return
                end

                -- Dynamic backend from Redis (key upstreamservers)
                local ok_ur, upstream_redis = pcall(require, "resty.upstream_redis")
                if ok_ur and upstream_redis and upstream_redis.get_backend then
                    ngx.var.backend = upstream_redis.get_backend()
                else
                    ngx.var.backend = "http://127.0.0.1:9000"
                end
            }
            include location_proxy_setting.conf;
        }
    }

    # ============================================================
    # DEFAULT SERVER
    # ============================================================
    server {
        listen 9000;
        location / { return 200 "Welcome to Default Server"; }
        # Endpoint to retrieve statistics
        location /stats {
            content_by_lua_block {
                local stats_history = ngx.shared.stats_history
                local cjson = require "cjson"
                
                -- Get parameters
                local args = ngx.req.get_uri_args()
                local timestamp = args.timestamp
                local format = args.format or "json"
                
                if timestamp then
                    -- Get specific interval
                    local stats = stats_history:get(tostring(timestamp))
                    if stats then
                        ngx.say(stats)
                    else
                        ngx.status = ngx.HTTP_NOT_FOUND
                        ngx.say(cjson.encode({error = "No data for timestamp"}))
                    end
                else
                    -- Get latest stats (by highest timestamp key)
                    local keys = stats_history:get_keys(0)
                    if #keys > 0 then
                        table.sort(keys, function(a, b)
                            return tonumber(a) < tonumber(b)
                        end)
                        local latest_key = keys[#keys]
                        local latest = stats_history:get(latest_key)
                        ngx.say(latest)
                    else
                        ngx.say(cjson.encode({error = "No statistics available"}))
                    end
                end
            }
        }
        
        # Endpoint to get list of available timestamps
        location /stats/timestamps {
            content_by_lua_block {
                local stats_history = ngx.shared.stats_history
                local cjson = require "cjson"
                
                local keys = stats_history:get_keys(0)
                table.sort(keys)
                ngx.say(cjson.encode(keys))
            }
        }
    }
}
