# ============================================================
# DEFAULT SERVER
# ============================================================
server {
    listen 9000;
    location / { return 200 "Welcome to Default Server"; }

    location ~ /purge(/.*) {
        allow              127.0.0.1;
        deny               all;

        default_type       application/json;
        redis_cache_handler     on;
        redis_cache_purge_query "$1";
    }
    
    location /server_traffic_stats {
        content_by_lua_block {
            require("resty.stats_api").server_traffic_stats()
        }
    }

    location /ip_request_stats {
        content_by_lua_block {
            require("resty.stats_api").ip_request_stats()
        }
    }

    location /url_request_stats {
        content_by_lua_block {
            require("resty.stats_api").url_request_stats()
        }
    }

    location /useragent_request_stats {
        content_by_lua_block {
            require("resty.stats_api").useragent_request_stats()
        }
    }

    location /country_request_stats {
        content_by_lua_block {
            require("resty.stats_api").country_request_stats()
        }
    }

    location /isp_request_stats {
        content_by_lua_block {
            require("resty.stats_api").isp_request_stats()
        }
    }

    location /referer_request_stats {
        content_by_lua_block {
            require("resty.stats_api").referer_request_stats()
        }
    }

    location /server_traffic_stats/timestamps {
        content_by_lua_block {
            require("resty.stats_api").server_traffic_stats_timestamps()
        }
    }

    location /ip_request_stats/timestamps {
        content_by_lua_block {
            require("resty.stats_api").ip_request_stats_timestamps()
        }
    }

    location /url_request_stats/timestamps {
        content_by_lua_block {
            require("resty.stats_api").url_request_stats_timestamps()
        }
    }

    location /useragent_request_stats/timestamps {
        content_by_lua_block {
            require("resty.stats_api").useragent_request_stats_timestamps()
        }
    }

    location /country_request_stats/timestamps {
        content_by_lua_block {
            require("resty.stats_api").country_request_stats_timestamps()
        }
    }

    location /isp_request_stats/timestamps {
        content_by_lua_block {
            require("resty.stats_api").isp_request_stats_timestamps()
        }
    }

    location /referer_request_stats/timestamps {
        content_by_lua_block {
            require("resty.stats_api").referer_request_stats_timestamps()
        }
    }

    location /l4_attack_stats/timestamps {
        content_by_lua_block {
            require("resty.stats_api").l4_attack_stats_timestamps()
        }
    }

    location /l4_attack_stats {
        content_by_lua_block {
            require("resty.stats_api").l4_attack_stats()
        }
    }
}
