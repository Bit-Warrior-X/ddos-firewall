# ============================================================
# INTERNAL STATS / PURGE SERVER
# ============================================================
server {
    listen 9000 reuseport;
    access_log off;
    default_type application/json;

    location / {
        default_type text/plain;
        # Internal-only listener (:9000). Must never be used as a customer origin.
        return 404 "stats listener — not an origin\n";
    }

    location ~ /purge(/.*) {
        allow              127.0.0.1;
        deny               all;

        redis_cache_handler     on;
        redis_cache_purge_query "$1";
    }

    location /req-status {
        req_status_show on;
    }

    location ~ ^/(?<stats_endpoint>server_traffic_stats|site_traffic_stats|ip_request_stats|url_request_stats|useragent_request_stats|country_request_stats|isp_request_stats|referer_request_stats|domain_request_stats|content_type_request_stats|cache_miss_url_stats|block_reason_stats|l4_attack_stats)/timestamps$ {
        content_by_lua_block {
            require("resty.stats_api").dispatch_timestamps()
        }
    }

    location ~ ^/(?<stats_endpoint>server_traffic_stats|site_traffic_stats|ip_request_stats|url_request_stats|useragent_request_stats|country_request_stats|isp_request_stats|referer_request_stats|domain_request_stats|content_type_request_stats|cache_miss_url_stats|block_reason_stats|l4_attack_stats)$ {
        content_by_lua_block {
            require("resty.stats_api").dispatch()
        }
    }

    location = /l7_attack {
        allow 127.0.0.1;
        deny  all;
        content_by_lua_block {
            require("resty.l7_attack").api()
        }
    }

    location = /access_logs {
        default_type application/x-ndjson;
        content_by_lua_block {
            require("resty.stats_api").access_logs()
        }
    }
}
