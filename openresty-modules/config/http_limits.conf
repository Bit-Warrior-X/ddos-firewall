# Per-IP L7 rate / concurrency limits (included from athens.conf).
# Enforced in the preaccess phase, before access_by_lua, so over-limit
# requests never reach Lua or Redis. With HTTP/2, limit_conn counts
# concurrent streams per client IP.
# Rejections still reach log_by_lua, where resty.l7_guard counts them
# ($limit_req_status / $limit_conn_status = REJECTED) and escalates to XDP.

limit_req_zone  $binary_remote_addr zone=l7_perip:32m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=l7_conn:16m;

limit_req_status  444;
limit_conn_status 444;
limit_req_log_level  info;
limit_conn_log_level info;
