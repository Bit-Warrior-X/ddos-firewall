# Cache purge Redis index (see ngx_cache_purge module).
# Lua sync (resty.cache_purge_sync) listens for key expired/del events on this DB
# and deletes the mapped nginx cache file.
# notify-keyspace-events is set in redis-socket.conf (Exgh$).
#cache_purge_redis_host "localhost";
#cache_purge_redis_port 6379;
cache_purge_redis_socket_path "/tmp/redis.sock";
cache_purge_redis_database 2;
