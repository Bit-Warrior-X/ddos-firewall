user nginx;
worker_processes auto;
error_log logs/error.log debug;
worker_rlimit_nofile 100000;
worker_priority -10;
#pid /run/nginx.pid;

events {
    worker_connections  65535;
    use epoll;
    multi_accept on;
}

http {
    #include       mime.types;
    #default_type  application/octet-stream;
    
    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;
    
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  /usr/local/openresty/nginx/logs/access.log  main;
    #access_log off;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   30;
    types_hash_max_size 8192;
    
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    client_body_buffer_size 10K;
    client_header_buffer_size 1k;
    client_max_body_size 8m;
    large_client_header_buffers 4 4k;

    lua_package_path "$prefixlua/?.so;;$prefixlua/module/?.so;$prefixlua/?.lua;$prefixlua/module/?.lua;;";

    lua_shared_dict ip_data 178m;

    server {
        listen       8080;
        server_name  localhost;

        # acl on/off
        acl on;

        # Geo database path;
        acl_geo_database_path /usr/local/openresty/nginx/lua/geoip2/city.mmdb;

        # Shm options (These options are mandantory for acl use)
        acl_acl_rule_shm_size 10m;
        acl_cc_deny_shm_size 20m;
	
	# Waf Captcha option
	acl_captcha sitekey=cb5e82de-6f7d-4fbe-82b1-e21add9cb67c secret=ES_4b2924dcb81a461ca94aa4bb3a500bc1 verify=/cdn_captcha api=https://hcaptcha.com/siteverify;

        location / {
            access_by_lua_block {
                local is_handle_acl_or, handle_acl = pcall(require, 'resty.handle_acl')
                if not is_handle_acl_or then
                    ngx.log(ngx.ERR, 'need to build with nginx_http_acl module')
                    return 501
                end

                local ret = handle_acl.process_acl_id(1);
                if ret == 1 then
                    ngx.say("Welcome to OpenResty acl nginx");
                else
                    ngx.say("Forbidden");
                end
            }
        }

        location /acl_rule1 {
            access_by_lua_block {
                local is_handle_acl_or, handle_acl = pcall(require, 'resty.handle_acl')
                if not is_handle_acl_or then
                    ngx.log(ngx.ERR, 'need to build with nginx_http_acl module')
                    return 501
                end
                local cfg = [[{
                    id = 1,
                    rules = {
                        {{
                            action = 2,
                            priority = 10,
                            [
                                ["Header","Content-Type","is in","aaa, bbb, ccc"] 
                                OR 
                                ["URI Path","-","contains","/api/config"] 
                                OR 
                                [
                                    ["UserAgent","-","contains","Firefox/120.0"]
                                    OR
                                    ["Geo","-","is in","Asia, China, Guangdong"]
                                ]
                            ]
                        }},
                        {{
                            action = 1,
                            priority = 15,
                            [
                                ["Request Frequency","-",">=","10times/60s"]
                            ]
                        }}
                    }
                }]]
                
                local ok, err = handle_acl.set_str_acl_rule(cfg)
                if not ok then
                    ngx.log(ngx.ERR, 'failed to set acl rule string: ', err)
                    return 403
                end

                ngx.log(ngx.INFO, 'set acl rule string success')
                ngx.say('hello workd')
            }
        }

        location /acl_rule2 {
            access_by_lua_block {
                local is_handle_acl_or, handle_acl = pcall(require, 'resty.handle_acl')
                if not is_handle_acl_or then
                    ngx.log(ngx.ERR, 'need to build with nginx_http_acl module')
                    return 501
                end
                local cfg = [[{
                    id = 2,
                    rules = {
                        {{ 
                            action = 2, 
                            priority = 9,
                            [
                                ["Geo","-","is in","Asia, Singapore, "]
                                AND 
                                [
                                    ["UserAgent","-","contains","Firefox/120.0"]
                                    OR
                                    ["Geo","-","is in","Asia, Singapore, "]
                                ]
                            ]
                        }},
                        {{
                            action = 2, 
                            priority = 10,
                            [
                                [
                                    ["UserAgent","-","contains","Firefox/11.0"]
                                    OR
                                    ["Geo","-","is in","Asia, China, Guangdong"]
                                ]
                                OR
                                ["Request Frequency","-","<","10times/60s"]
                            ]
                        }}
                    }
                }]]
                
                local ok, err = handle_acl.set_str_acl_rule(cfg)
                if not ok then
                    ngx.log(ngx.ERR, 'failed to set acl rule string: ', err)
                    return 403
                end

                ngx.log(ngx.INFO, 'set acl rule string success')
                ngx.say('hello workd')
            }
        }

        location /acl_rule3 {
            access_by_lua_block {
                local is_handle_acl_or, handle_acl = pcall(require, 'resty.handle_acl')
                if not is_handle_acl_or then
                    ngx.log(ngx.ERR, 'need to build with nginx_http_acl module')
                    return 501
                end
                local cfg = {
                    id = 1,
                    rules = {
                        {
                            action = 1,
                            priority = 10,
                            rule = [[
                                [
                                    ["Header","X-Header","is in","aaa, bbb, ccc"]
                                ]
                            ]]
                        }
                    }
                }
                
                local ok, err = handle_acl.set_acl_rule(cfg)
                if not ok then
                    ngx.log(ngx.ERR, 'failed to set acl rule : ', err)
                    return 403
                end

                ngx.log(ngx.INFO, 'set acl rule success')
                ngx.say('hello workd')
            }
        }

        location /acl_rule1_remove {
            access_by_lua_block {
                local is_handle_acl_or, handle_acl = pcall(require, 'resty.handle_acl')
                if not is_handle_acl_or then
                    ngx.log(ngx.ERR, 'need to build with nginx_http_acl module')
                    return 501
                end
                local cfg = [[{
                    id = 1,
                    rules = {}
                }]]
                local ok, err = handle_acl.set_str_acl_rule(cfg)
                if not ok then
                    ngx.log(ngx.ERR, 'failed to set acl rule string: ', err)
                    return 403
                end

                ngx.log(ngx.INFO, 'set acl rule string success')
                ngx.say('hello workd')
            }
        }

        location /acl_rule2_remove {
            access_by_lua_block {
                local is_handle_acl_or, handle_acl = pcall(require, 'resty.handle_acl')
                if not is_handle_acl_or then
                    ngx.log(ngx.ERR, 'need to build with nginx_http_acl module')
                    return 501
                end
                local cfg = [[{
                    id = 2,
                    rules = {}
                }]]
                local ok, err = handle_acl.set_str_acl_rule(cfg)
                if not ok then
                    ngx.log(ngx.ERR, 'failed to set acl rule string: ', err)
                    return 403
                end

                ngx.log(ngx.INFO, 'set acl rule string success')
                ngx.say('hello workd')
            }
        }
    }
}

