user openresty;

daemon off;

error_log /dev/stdout info;

worker_processes        auto;
worker_cpu_affinity     auto;
worker_rlimit_nofile    51200;
worker_shutdown_timeout 60s;

events {
    multi_accept on;
    use          epoll;

    worker_connections  51200;
}


thread_pool default threads=32 max_queue=65536;

http {
    access_log /dev/stdout;

    proxy_cache_background_update   on;
    proxy_cache_revalidate          on;

    proxy_cache_methods GET HEAD;
    proxy_cache_path /usr/local/openresty/nginx/cache/ levels=1:2 keys_zone=gezone:10m inactive=100d max_size=1024m;

    # purge cache module
    cache_purge_redis_host "localhost";
    cache_purge_redis_port 6379;
    cache_purge_redis_database 2;

    server {
        listen 127.0.0.1:8000 reuseport;

        set $cache_name "test_cache";

        add_header X-Cache-Status $upstream_cache_status;

        proxy_ignore_headers Cache-Control Expires;

        proxy_set_header Range           $slice_range;

        # purge cache
        location ~ /purge(/.*) {
            allow              127.0.0.1;
            deny               all;

            redis_cache_handler     on;
            redis_cache_purge_query "$1";
        }

        location / {
            access_by_lua_block {
                local is_handle_slice_or, handle_slice = pcall(require, "resty.handle_slice")
                if not is_handle_slice_or then
                    return 501
                end

                local ok, err = handle_slice.set_slice(0);
                if not ok then
                    return 403
                end
            }

            proxy_pass           http://localhost:8081;
            proxy_cache          gezone;
            proxy_cache_key      $cache_name$slice_range;
            proxy_cache_valid    any 5m;
        }
    }

    server {
        listen 127.0.0.1:8081 reuseport;

        return 200 'proxy upstream';
    }
}