# Builds angelos, sparta, athens per target OS, packs one tarball per matrix row, uploads on tag v*.
#
# Use the tarball whose os_slug matches the target host (see BUILD_INFO inside the archive).
# Example: Ubuntu 22.04 → dorian-ddos-firewall-<version>-ubuntu-22.04-payload.tar.gz
#
# Secrets (repository → Settings → Secrets → Actions):
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_PRIVATE_KEY, DEPLOY_SSH_PORT
# Optional:
#   DEPLOY_OS_SLUG — if set (e.g. ubuntu-22.04), only that variant is SCP'd on tag push.
#                    If unset, every built variant is uploaded.
#
# Server path: /opt/dorian/uploads/dorian-ddos-firewall-<version>-<os_slug>-payload.tar.gz

name: Build payload

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENRESTY_VER: "1.27.1.2"
  DORIAN_UPLOAD_DIR: /opt/dorian/uploads

jobs:
  payload:
    name: payload (${{ matrix.os_slug }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_slug: ubuntu-22.04
            runner: ubuntu-22.04
          - os_slug: ubuntu-24.04
            runner: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
      os_slug: ${{ matrix.os_slug }}
    steps:
      - uses: actions/checkout@v4

      - name: Builder environment
        id: builder
        run: |
          set -euo pipefail
          echo "os_slug=${{ matrix.os_slug }}" >> "${GITHUB_OUTPUT}"
          echo "runner=${{ matrix.runner }}" >> "${GITHUB_OUTPUT}"
          echo "builder_id=$(. /etc/os-release && echo "${ID}-${VERSION_ID}")" >> "${GITHUB_OUTPUT}"
          echo "glibc=$(ldd --version | head -1)" >> "${GITHUB_OUTPUT}"

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang llvm curl ca-certificates git \
            "linux-headers-$(uname -r)" \
            libbpf-dev   \
            libnetfilter-conntrack-dev libsqlite3-dev libssl-dev \
            libmicrohttpd-dev \
            libpcre3-dev libpcre2-dev zlib1g-dev \
            libev-dev libhiredis-dev \
            flex bison libcurl4-openssl-dev libsodium-dev perl \
            cmake \
            python3 python3-venv python3-dev python3-pip \
            pkg-config

      - name: Install libxdp (apt on 24.04, source build on 22.04)
        run: bash .github/scripts/install-libxdp-dev.sh

      - name: Build angelos payload
        run: |
          set -euo pipefail
          python3 -m venv "${GITHUB_WORKSPACE}/.ci-venv-angelos"
          # shellcheck disable=SC1091
          source "${GITHUB_WORKSPACE}/.ci-venv-angelos/bin/activate"
          export DDOS_FW_CI_PAYLOAD_ONLY=1
          bash api_parser/build.sh

      - name: Build sparta payload
        env:
          DDOS_FW_CI_PAYLOAD_ONLY: "1"
          PKG_CONFIG_PATH: /usr/local/lib/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig
          LDFLAGS: -L/usr/local/lib
        run: bash ebpf_firewall/script.sh

      - name: Fetch OpenResty source
        working-directory: openresty-modules
        run: |
          set -euo pipefail
          curl -fsSL "https://openresty.org/download/openresty-${OPENRESTY_VER}.tar.gz" -o /tmp/openresty.tgz
          tar xzf /tmp/openresty.tgz -C "${GITHUB_WORKSPACE}/openresty-modules"

      - name: Apply nginx test_types_hash_bucket patch
        working-directory: openresty-modules
        run: |
          set -euo pipefail
          # gzip_types hash bucket is hardcoded to 64 (~46-char max MIME). OpenXML types need 128.
          NGINX_BUNDLE="openresty-${OPENRESTY_VER}/bundle/nginx-1.27.1"
          PATCH="ngx_gzip/ngx_http_test_types_hash_bucket-1.27.1.patch"
          test -d "${NGINX_BUNDLE}/src/http"
          test -f "${PATCH}"
          patch -p1 -d "${NGINX_BUNDLE}" --forward < "${PATCH}"
          python3 - <<PY
          from pathlib import Path
          import re
          import sys
          text = Path("${NGINX_BUNDLE}/src/http/ngx_http.c").read_text()
          sizes = re.findall(
              r'hash\.bucket_size = (\d+);\s*\n\s*hash\.name = "test_types_hash";',
              text,
          )
          if sizes != ["128", "128"]:
              print(f"error: expected two test_types_hash bucket_size=128 sites, got {sizes}", file=sys.stderr)
              sys.exit(1)
          print("test_types_hash_bucket patch OK (both sites = 128)")
          PY

      - name: Prepare uthash, cJSON and libmaxminddb
        working-directory: openresty-modules
        run: |
          set -euo pipefail
          mkdir -p .ci-deps
          git clone --depth 1 https://github.com/troydhanson/uthash.git .ci-deps/uthash
          if [[ ! -d .ci-deps/uthash/include ]]; then
            mkdir -p .ci-deps/uthash/include
            cp .ci-deps/uthash/src/*.h .ci-deps/uthash/include/
          fi
          if [[ ! -f ngx_acl/inc/cjson/cJSON.h ]]; then
            rm -rf ngx_acl/inc/cjson
            git clone --depth 1 --branch v1.7.15 https://github.com/DaveGamble/cJSON.git ngx_acl/inc/cjson
          fi
          MM_PREFIX="${GITHUB_WORKSPACE}/openresty-modules/.ci-deps/libmaxminddb"
          cmake -S libmaxminddb -B .ci-deps/libmaxminddb-build-static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${MM_PREFIX}" \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF
          cmake --build .ci-deps/libmaxminddb-build-static -j"$(nproc)"
          cmake --install .ci-deps/libmaxminddb-build-static
          cmake -S libmaxminddb -B .ci-deps/libmaxminddb-build-shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${MM_PREFIX}" \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=OFF
          cmake --build .ci-deps/libmaxminddb-build-shared -j"$(nproc)"
          cmake --install .ci-deps/libmaxminddb-build-shared

      - name: Build athens payload
        working-directory: openresty-modules
        env:
          DDOS_FW_CI_PAYLOAD_ONLY: "1"
          LIB_UTHASH: ${{ github.workspace }}/openresty-modules/.ci-deps/uthash
          LIB_MAXMINDDB: ${{ github.workspace }}/openresty-modules/.ci-deps/libmaxminddb
          LIB_REDIS_ADAPTER: ${{ github.workspace }}/openresty-modules/.ci-deps/redis-adapter
        run: bash ./script.sh

      - name: Verify athens glibc linkage
        run: |
          set -euo pipefail
          athens_root="${GITHUB_WORKSPACE}/setup/payload/athens"
          nginx_bin="${athens_root}/nginx/sbin/nginx"
          luajit_lib="${athens_root}/luajit/lib"
          test -x "${nginx_bin}"
          test -f "${luajit_lib}/libluajit-5.1.so.2" || test -f "${luajit_lib}/libluajit-5.1.so"

          # Prefix is compile-time; nginx -V needs bundled luajit (runtime path is not on CI host).
          if ! strings "${nginx_bin}" | grep -q '/usr/local/share/dorian/athens'; then
            echo "error: nginx binary missing prefix /usr/local/share/dorian/athens" >&2
            strings "${nginx_bin}" | grep -E 'athens|dorian|runner' | head -10 || true
            exit 1
          fi
          echo "nginx prefix OK (/usr/local/share/dorian/athens)"

          export LD_LIBRARY_PATH="${luajit_lib}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          nginx_v="$("${nginx_bin}" -V 2>&1)"
          echo "${nginx_v}" | head -3

          # nginx -V lists configure args (e.g. --add-module=../ngx_purge/), not C symbol names.
          if ! echo "${nginx_v}" | grep -q 'ngx_purge'; then
            echo "error: nginx missing ngx_purge add-module" >&2
            exit 1
          fi
          if ! echo "${nginx_v}" | grep -q 'ngx_slice'; then
            echo "error: nginx missing ngx_slice add-module" >&2
            exit 1
          fi
          if ! echo "${nginx_v}" | grep -q 'http_slice_module'; then
            echo "error: nginx missing --with-http_slice_module" >&2
            exit 1
          fi
          if ! strings "${nginx_bin}" | grep -q 'redis_cache_handler'; then
            echo "error: nginx binary missing redis_cache_handler (cache purge module)" >&2
            exit 1
          fi
          echo "nginx modules OK (cache purge + slice)"

          # Confirm long gzip_types (OpenXML) work with the patched test_types_hash bucket.
          verify_dir="$(mktemp -d)"
          verify_conf="${verify_dir}/athens-gzip-verify.conf"
          cat > "${verify_conf}" <<EOF
          error_log ${verify_dir}/error.log;
          pid ${verify_dir}/nginx.pid;
          events {}
          http {
              types_hash_max_size 2048;
              types_hash_bucket_size 128;
              gzip on;
              gzip_types application/vnd.openxmlformats-officedocument.wordprocessingml.document application/vnd.openxmlformats-officedocument.spreadsheetml.sheet application/vnd.openxmlformats-officedocument.presentationml.presentation;
              server { listen 127.0.0.1:18080; return 200; }
          }
          EOF
          # Strip the YAML/shell indent so nginx sees a clean conf.
          sed -i 's/^[[:space:]]*//' "${verify_conf}"
          if ! "${nginx_bin}" -t -c "${verify_conf}" -p "${verify_dir}" 2>"${verify_dir}/nginx-t.err"; then
            echo "error: patched nginx rejected long OpenXML gzip_types (test_types_hash_bucket patch missing?)" >&2
            cat "${verify_dir}/nginx-t.err" >&2 || true
            cat "${verify_dir}/error.log" >&2 || true
            exit 1
          fi
          echo "nginx gzip_types OpenXML hash OK (test_types_hash_bucket patch)"

          echo "Host ldd: $(ldd --version | head -1)"
          echo "nginx dynamic deps:"
          ldd "${nginx_bin}" | head -20
          # Fail if binary requires a newer GLIBC than the builder provides.
          required="$(strings "${nginx_bin}" | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1 || true)"
          provided="$(ldd --version | awk 'NR==1 {print $NF}')"
          echo "nginx max GLIBC symbol: ${required:-unknown}, builder glibc: ${provided}"
          if [[ -n "${required}" ]]; then
            req_ver="${required#GLIBC_}"
            if dpkg --compare-versions "${req_ver}" gt "${provided}"; then
              echo "error: nginx requires GLIBC ${req_ver} but builder only has ${provided}" >&2
              exit 1
            fi
          fi

      - name: Product version
        id: version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          else
            v="$(tr -d ' \n\r\t' < VERSION)"
          fi
          echo "version=${v}" >> "${GITHUB_OUTPUT}"
          echo "Using product version: ${v}"

      - name: Pack full payload
        id: pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OS_SLUG: ${{ matrix.os_slug }}
        run: |
          set -euo pipefail
          echo "${VERSION}" > setup/payload/VERSION
          {
            echo "version=${VERSION}"
            echo "os_slug=${OS_SLUG}"
            echo "builder_id=${{ steps.builder.outputs.builder_id }}"
            echo "glibc=${{ steps.builder.outputs.glibc }}"
            echo "sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "run=${GITHUB_RUN_ID}"
            date -u --iso-8601=seconds
          } > setup/payload/BUILD_INFO
          name="dorian-ddos-firewall-${VERSION}-${OS_SLUG}-payload.tar.gz"
          tar czf "${name}" -C setup/payload angelos sparta athens VERSION BUILD_INFO
          echo "tarball=${name}" >> "${GITHUB_OUTPUT}"
          echo "Packed ${name} ($(du -h "${name}" | awk '{print $1}'))"

      - uses: actions/upload-artifact@v4
        with:
          name: full-payload-${{ matrix.os_slug }}
          path: ${{ steps.pack.outputs.tarball }}

  upload-to-server:
    name: upload payloads
    runs-on: ubuntu-latest
    needs: [payload]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Resolve deploy OS filter
        id: filter
        run: |
          set -euo pipefail
          filter="${DEPLOY_OS_SLUG:-}"
          echo "filter=${filter}" >> "${GITHUB_OUTPUT}"
          if [[ -n "${filter}" ]]; then
            echo "DEPLOY_OS_SLUG=${filter} — only this variant will be uploaded"
          else
            echo "DEPLOY_OS_SLUG unset — uploading all built variants"
          fi
        env:
          DEPLOY_OS_SLUG: ${{ vars.DEPLOY_OS_SLUG || secrets.DEPLOY_OS_SLUG || '' }}

      - uses: actions/download-artifact@v4
        with:
          pattern: full-payload-*
          merge-multiple: true
          path: dist

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Add SSH known hosts
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.DEPLOY_SSH_PORT }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload tarballs to server
        env:
          FILTER: ${{ steps.filter.outputs.filter }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DORIAN_UPLOAD_DIR: ${{ env.DORIAN_UPLOAD_DIR }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mapfile -t files < <(find dist -name 'dorian-ddos-firewall-*-payload.tar.gz' -type f | sort)
          if (( ${#files[@]} == 0 )); then
            echo "error: no payload tarballs found under dist/" >&2
            ls -laR dist || true
            exit 1
          fi
          ssh -p "${PORT}" "${USER}@${HOST}" "mkdir -p '${DORIAN_UPLOAD_DIR}'"
          uploaded=0
          for f in "${files[@]}"; do
            base="$(basename "${f}")"
            if [[ -n "${FILTER}" && "${base}" != *"-${FILTER}-payload.tar.gz" ]]; then
              echo "Skipping ${base} (DEPLOY_OS_SLUG=${FILTER})"
              continue
            fi
            scp -P "${PORT}" "${f}" "${USER}@${HOST}:${DORIAN_UPLOAD_DIR}/"
            echo "Uploaded ${base} → ${HOST}:${DORIAN_UPLOAD_DIR}/"
            uploaded=$((uploaded + 1))
          done
          if (( uploaded == 0 )); then
            echo "error: nothing uploaded (check DEPLOY_OS_SLUG filter)" >&2
            exit 1
          fi
