        vectors: { type: array, items: { type: string } }
        peak_rps: { type: integer }
        total_requests: { type: integer }
        total_blocked: { type: integer, description: Requests blocked by L7 protection }
        total_passed: { type: integer, description: Requests let through to the sites }
        blocked_ratio: { type: number, description: "total_blocked / total_requests (0..1)" }
        unique_ips: { type: integer }
        archive_path: { type: string, nullable: true, description: JSON archive on the edge }
        start_reported: { type: boolean }
        stop_reported: { type: boolean }

    L7AttackIncident:
      type: object
      description: |
        Every request has exactly one outcome, so
        `requests = passed + blocked + malformed + rapid_reset` (totals, timeline
        buckets, sites):

        - `blocked` — stopped by L7 protection: 444 (rate limit, concurrency
          limit, temporary block, WAF drop) or WAF deny / captcha (403)
        - `passed` — let through to the site (served from cache or origin)
        - `malformed` — no valid request line (400/408), rejected by nginx
        - `rapid_reset` — HTTP/2 stream cancelled by the client

        Recommended view: blocked vs passed requests per second from `timeline`
        (bucket value / 10), `blocked_ratio`, `peak_blocked_rps` /
        `peak_passed_rps`, and top IPs / URLs / countries with their blocked and
        passed split. L7 incidents carry request counts, not bandwidth.

        Counts in top lists / sites / status_codes are estimates when
        `sampling.estimated` is true (detail is sampled above ~3000 req/s);
        `totals`, `vectors` and `timeline` are exact. Detail (top lists, sites,
        codes) starts when the incident opens; totals and timeline include the
        confirmation seconds before it.
      properties:
        id: { type: string }
        status: { type: string, enum: [active, ended] }
        started_at: { type: integer }
        ended_at: { type: integer, nullable: true, description: Last second any vector was under attack }
        updated_at: { type: integer }
        duration: { type: integer }
        vector_list: { type: array, items: { type: string, enum: [flood, rapid_reset, malformed, blocked] } }
        vectors:
          type: object
          additionalProperties:
            type: object
            properties:
              first_at: { type: integer }
              last_at: { type: integer }
              active: { type: boolean }
              peak: { type: integer, description: Per second }
              peak_at: { type: integer }
              total: { type: integer }
              enter: { type: integer, description: Enter threshold when the vector started }
              exit: { type: integer }
        peak_rps: { type: integer, description: Peak requests/s (all outcomes) }
        peak_rps_at: { type: integer }
        peak_blocked_rps: { type: integer, description: Peak blocked requests/s }
        peak_blocked_rps_at: { type: integer }
        peak_passed_rps: { type: integer, description: Peak passed requests/s }
        peak_passed_rps_at: { type: integer }
        blocked_ratio: { type: number, description: "totals.blocked / totals.requests (0..1)" }
        blocked_ips: { type: integer, description: Client IPs with at least one blocked request (sampled) }
        totals:
          type: object
          properties:
            requests: { type: integer }
            passed: { type: integer }
            rapid_reset: { type: integer }
            malformed: { type: integer }
            blocked: { type: integer }
            errors_5xx: { type: integer }
            escalations: { type: integer, description: IPs blocked by l7_guard during the incident }
        unique_ips: { type: integer }
        sampling:
          type: object
          properties:
            max_factor: { type: integer }
            estimated: { type: boolean }
        top_ips: { type: array, items: { type: object, properties: { ip: { type: string }, requests: { type: integer }, blocked: { type: integer }, passed: { type: integer } } } }
        top_urls: { type: array, items: { type: object, properties: { url: { type: string, description: host + path }, requests: { type: integer }, blocked: { type: integer }, passed: { type: integer } } } }
        top_user_agents: { type: array, items: { type: object, properties: { user_agent: { type: string }, requests: { type: integer } } } }
        top_countries: { type: array, items: { type: object, properties: { country_iso: { type: string }, requests: { type: integer }, blocked: { type: integer }, passed: { type: integer } } } }
        status_codes: { type: object, additionalProperties: { type: integer } }
        protocols: { type: object, additionalProperties: { type: integer } }
        methods: { type: object, additionalProperties: { type: integer } }
        block_rules:
          type: object
          additionalProperties: { type: integer }
          description: "rule_type[|rule_id] → requests (temporary-block, anti-cc|1008, limit_req, limit_conn, …)"
        sites:
          type: array
          description: Per site/host (top 100); site_id 0 / host `_` = malformed connections
          items:
            type: object
            properties:
              site_id: { type: integer }
              host: { type: string }
              requests: { type: integer }
              passed: { type: integer }
              blocked: { type: integer }
              rapid_reset: { type: integer }
              malformed: { type: integer }
              errors: { type: integer }
        escalations:
          type: object
          properties:
            total: { type: integer }
            by_reason: { type: object, additionalProperties: { type: integer } }
            xdp: { type: boolean }
            ips:
              type: array
              description: First 2000 IPs blocked by l7_guard
              items:
                type: object
                properties:
                  ip: { type: string }
                  at: { type: integer }
                  reason: { type: string, enum: [rapid-reset, rejected, malformed, flood] }
                  ttl: { type: integer }
        timeline:
          type: array
          description: 10-second buckets (only in attack_stop and the GET API)
          items:
            type: object
            properties:
              t: { type: integer }
              requests: { type: integer }
              passed: { type: integer }
              blocked: { type: integer }
              rapid_reset: { type: integer }
              malformed: { type: integer }
              errors_5xx: { type: integer }
              escalations: { type: integer }
        detector:
          type: object
          additionalProperties: true
          description: Floors and timings in effect

