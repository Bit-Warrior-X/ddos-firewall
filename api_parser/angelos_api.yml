openapi: 3.0.3
info:
  title: Angelos Edge Agent API
  description: |
    HTTP API exposed by the **angelos** edge agent (`api_parser`) on each protected
    server. The Dorian **back-end** calls these endpoints directly; the Vue
    front-end never talks to angelos.

    **Base URL (inbound):** `http://{edge-server-ip}:5000`

    **Transport**

    - Method: `POST` for all endpoints documented here
    - Content-Type: `application/json`
    - Success: HTTP 2xx with empty or JSON body
    - Failure: non-2xx; Dorian surfaces this as HTTP 502 to dashboard clients

    **Scope**

    - **Server-scoped** calls target one edge node IP (e.g. listening ports,
      temporary blacklist).
    - **Site-scoped** calls are issued by Dorian once per edge server assigned
      to the site; each request carries that edge node's `serverId`.

    **L4 vs L7**

    - `/API/L7/*` — Layer 7 WAF, cache, upstream, compress (angelos)
    - `/API/L4/*` — Layer 4 firewall whitelist/blacklist and config (same agent
      port by default; paths configurable in Dorian `config.json`)

    **Edge → panel sync (outbound)**

    Angelos also **POSTs** configure snapshots to the Dorian panel (not served by
    the edge). See tag **Edge → Panel** and path `/report_edge_configure`.
    Interval defaults to 60s (`EDGE_LIST_SYNC_INTERVAL`).

    This spec is derived from Dorian back-end callers in `internal/api/l7_site_push.go`,
    `internal/api/handlers.go`, and `internal/api/agent_client.go`.
  version: 1.1.0

servers:
  - url: http://{edgeServerIp}:5000
    description: Edge server running angelos (inbound — panel calls agent)
    variables:
      edgeServerIp:
        default: 203.0.113.10
        description: Public IP of the protected edge node
  - url: https://panel.dorian.center/api
    description: Dorian panel API (outbound — angelos calls panel)

tags:
  - name: L7 WAF
  - name: L7 Traffic
  - name: L7 Cache
  - name: L4 Firewall
  - name: Edge → Panel
    description: |
      Outbound reports from angelos to the Dorian panel. These paths are hosted
      by the **panel**, not by the edge agent.

paths:
  /report_cache_hit:
    post:
      servers:
        - url: https://panel.dorian.center/api
          description: Dorian panel API (angelos → panel)
      tags: [Edge → Panel]
      summary: L7 cache-hit breakdown (content types + top miss URLs)
      description: |
        Angelos worker (`cache_hit_sync`) POSTs each closed Athens stats bucket
        (default every **60s**) for the panel cache-hit page.

        **Sources on the edge (Athens `:9000`)**

        - `GET /content_type_request_stats?timestamp=…` — requests / cached
          requests / bytes by content-type family
        - `GET /cache_miss_url_stats?timestamp=…` — top URLs with
          `$upstream_cache_status` in `MISS` or `EXPIRED`

        Panel fields:

        - `content_types` — hit ratio by content type
          (`cache_hit_ratio = cached_request_count / request_count`)
        - `top_miss_urls` — URLs that send the most traffic to origin

        Aliases `content_type_request_stats` / `cache_miss_url_stats` mirror the
        Athens metrics API names (same arrays).
      operationId: reportCacheHit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CacheHitReport"
            example:
              token: edge-auth-token
              command: report_cache_hit
              reported_at: 1742800060
              timestamp: 1742800000
              interval_seconds: 60
              content_types_count: 3
              top_miss_urls_count: 2
              content_types:
                - site_id: 3
                  content_type: image
                  request_count: 4200
                  cached_request_count: 3900
                  cache_hit_ratio: 0.928571
                  traffic_l7_tx: 62914560
                  traffic_cached_tx: 58720256
                - site_id: 3
                  content_type: html
                  request_count: 2600
                  cached_request_count: 900
                  cache_hit_ratio: 0.346154
                  traffic_l7_tx: 15728640
                  traffic_cached_tx: 5242880
              top_miss_urls:
                - site_id: 3
                  domain: www.example.com
                  url: /products/list
                  miss_count: 310
                  request_count: 420
                - site_id: 3
                  domain: www.example.com
                  url: /api/status
                  miss_count: 85
                  request_count: 190
      responses:
        "200":
          description: Cache-hit snapshot accepted
        "4XX":
          $ref: "#/components/responses/AgentError"

  /report_l7_attack:
    post:
      servers:
        - url: https://panel.dorian.center/api
          description: Dorian panel API (angelos → panel)
      tags: [Edge → Panel]
      summary: L7 attack incident start / update / stop
      description: |
        Angelos worker (`l7_attack_sync`) reports L7 attack incidents detected by
        Athens (`resty.l7_attack`). One incident = one server-wide attack episode,
        identified by `req_id` (same scheme as L4 `report_attack`:
        `(started_at << 20) | seq`, sent as a string).

        - `attack_start` — once, after the incident opens (also sent before
          `attack_stop` if start could not be delivered earlier)
        - `attack_update` — every 30 s while the attack is active (best effort)
        - `attack_stop` — once, with the final snapshot including `timeline`

        Start/stop are retried with backoff (up to 7 days) until the panel
        answers 2xx, so the panel must treat them idempotently by `req_id`.
        Token is sent both as `Authorization: Bearer` and in the body.

        **Detection** (per second, server-wide): vectors `flood` (all requests),
        `rapid_reset` (HTTP/2 streams reset by the client), `malformed` (no
        request line, 400/408) and `blocked` (444). A vector enters ATTACK after
        `attack_confirm_seconds` at or above its threshold (immediately on a 3x
        surge) and leaves after `attack_exit_seconds` below its exit threshold.
        The incident ends once every vector has been normal for
        `attack_cooldown_seconds`. Thresholds: see `l7guard` attack_* settings.
      operationId: reportL7Attack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L7AttackReport"
      responses:
        "200":
          description: Event accepted
        "4XX":
          $ref: "#/components/responses/AgentError"

  /report_edge_configure:
    post:
      servers:
        - url: https://panel.dorian.center/api
          description: Dorian panel API (angelos → panel)
      tags: [Edge → Panel]
      summary: Edge L4+L7 configure snapshot (periodic)
      description: |
        Angelos background worker (`edge_list_sync`) POSTs a full configure
        snapshot every `EDGE_LIST_SYNC_INTERVAL` seconds (default **60**).

        **Sources on the edge**

        - **L4 SQLite** (`firewall_control.db`): `white_ips`, `blocked_ips`
        - **L4 file**: `firewall.config` (XDP thresholds, device, geo, …)
        - **L7 Redis**: per-site `domain` / `waf` / `cache` / `listening` /
          `upstreamservers` / `compress` / `ssl`, edge `listeningports`,
          `temporaryblacklist:*`, legacy ACL globals
        - **L7 file**: `server_default_ports.conf` (derived listen lines)

        SSL PEMs are **redacted by default** (`EDGE_CONFIG_REPORT_INCLUDE_SSL_PEMS=false`);
        the report then includes presence/length fields only.

        Panel should upsert / reconcile its DB from this payload so edge-local
        whitelist/blacklist and Redis config stay in sync with the backend.
      operationId: reportEdgeConfigure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdgeConfigureReport"
            example:
              token: edge-auth-token
              command: report_edge_configure
              reported_at: 1742800000
              include_ssl_pems: false
              whitelist_count: 2
              blocklist_count: 1
              site_count: 1
              temporaryblacklist_count: 0
              whitelist:
                - ip: 203.0.113.50
                  reason: L7 upstream backend
                  created: "2026-03-24 02:00:00"
              blocklist:
                - ip: 198.51.100.10
                  type: L4
                  duration: 3600
                  reason: syn_flood
                  created: "2026-03-24 02:10:00"
              l4:
                firewall_config:
                  dev: eth0
                  attach_mode: native
                  syn_valid: "1"
                  syn_threshold: "100000"
                  ack_valid: "1"
                  ack_threshold: "300000"
                firewall_config_error: null
                whitelist:
                  - ip: 203.0.113.50
                    reason: L7 upstream backend
                    created: "2026-03-24 02:00:00"
                blocklist:
                  - ip: 198.51.100.10
                    type: L4
                    duration: 3600
                    reason: syn_flood
                    created: "2026-03-24 02:10:00"
              l7:
                edge:
                  listeningports:
                    - id: 1
                      serverId: 1033
                      port: 80
                      protocol: http
                      status: ENABLE
                  temporaryblacklist: []
                  acl_rules: []
                  acl_apply_rules: []
                  l7guard:
                    enabled: true
                    xdp: true
                    window: 10
                    rst_threshold: 100
                    rej_threshold: 200
                    bad_threshold: 20
                    req_threshold: 1000
                    block_ttl: 600
                    block_max_ttl: 3600
                    allow_ips: []
                  legacy_global:
                    whitelist: {}
                    blacklist: {}
                    upstreamservers: []
                    cacherules: []
                sites:
                  "55":
                    domain: www.example.com
                    domains:
                      - www.example.com
                      - example.com
                    waf:
                      whitelist:
                        id: 1
                        rules: []
                      blacklist:
                        id: 1
                        rules: []
                    cache: []
                    listening:
                      http_ports:
                        - port: 80
                          protocol: http
                      https_ports:
                        - port: 443
                          protocol: https
                    upstreamservers:
                      - ip_port: "198.51.100.20:443"
                        description: Primary origin
                    compress:
                      css: true
                      html: true
                      js: true
                    ssl:
                      site_id: 55
                      domain: www.example.com
                      ssl_type: custom
                      ssl_cert_present: true
                      ssl_cert_key_present: true
                      ssl_cert_len: 1820
                      ssl_cert_key_len: 1670
                files:
                  server_default_ports_conf: |
                    listen 80 reuseport;
                    listen 443 ssl reuseport;
      responses:
        "200":
          description: Snapshot accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
        "4XX":
          description: Invalid token or payload
        "5XX":
          description: Panel failed to persist snapshot

  /API/L7/l7_update_whitelist:
    post:
      tags: [L7 WAF]
      summary: Replace WAF whitelist rules
      description: Dorian trigger — site WAF whitelist create/update/delete/batch-delete.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L7WhitelistUpdate"
            example:
              serverId: 1033
              siteId: 55
              serverIp: 203.0.113.10
              rules:
                - id: 101
                  wafRuleId: 42
                  ips: 192.168.1.0/24,10.0.0.5
                  url: "/*"
                  method: GET,POST
                  description: Office network bypass
                - id: 102
                  wafRuleId: 42
                  ips: 203.0.113.50
                  url: /api/health
                  method: GET
                  description: Monitoring probe
      responses:
        "200":
          description: Rules applied
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L7/l7_update_blacklist:
    post:
      tags: [L7 WAF]
      summary: Replace WAF blacklist rules
      description: Dorian trigger — site WAF blacklist mutations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L7BlacklistUpdate"
            example:
              serverId: 1033
              siteId: 55
              serverIp: 203.0.113.10
              rules:
                - id: 201
                  wafRuleId: 42
                  ips: 198.51.100.77
                  url: "/*"
                  method: "*"
                  behavior: block
                  description: Known bad actor
      responses:
        "200":
          description: Rules applied
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L7/l7_update_geolocation:
    post:
      tags: [L7 WAF]
      summary: Replace WAF geolocation rules
      description: Only rules with status ENABLE are sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L7GeolocationUpdate"
            example:
              serverId: 1033
              siteId: 55
              serverIp: 203.0.113.10
              rules:
                - id: 301
                  wafRuleId: 42
                  country: CN,RU
                  url: "/*"
                  behavior: block
                  operation: BLACK
                  status: ENABLE
                - id: 302
                  wafRuleId: 42
                  country: US,CA,GB
                  url: /checkout/*
                  behavior: allow
                  operation: WHITE
                  status: ENABLE
      responses:
        "200":
          description: Rules applied
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L7/l7_update_antiheader:
    post:
      tags: [L7 WAF]
      summary: Replace WAF anti-header rules
      description: Only enabled rules are sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L7AntiHeaderUpdate"
            example:
              serverId: 1033
              siteId: 55
              serverIp: 203.0.113.10
              rules:
                - id: 401
                  wafRuleId: 42
                  url: "/*"
                  header: X-Forwarded-For
                  value: ""
                  blockMode: missing
                  behavior: block
                  status: ENABLE
      responses:
        "200":
          description: Rules applied
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L7/l7_update_intervalfreqlimit:
    post:
      tags: [L7 WAF]
      summary: Replace interval frequency limit rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L7IntervalFreqLimitUpdate"
            example:
              serverId: 1033
              siteId: 55
              serverIp: 203.0.113.10
              rules:
                - id: 501
                  serverId: 1033
                  url: /login
                  time: 60
                  request_count: 30
                  behavior: block
                  status: ENABLE
      responses:
        "200":
          description: Rules applied
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L7/l7_update_secondfreqlimit:
    post:
      tags: [L7 WAF]
      summary: Replace per-second frequency limit rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L7SecondFreqLimitUpdate"
            example:
              serverId: 1033
              siteId: 55
              serverIp: 203.0.113.10
              rules:
                - id: 601
                  serverId: 1033
                  url: /api/*
                  request_count: 100
                  burst: 20
                  behavior: block
                  status: ENABLE
      responses:
        "200":
          description: Rules applied
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L7/l7_update_responsefreq:
    post:
      tags: [L7 WAF]
      summary: Replace response frequency rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L7ResponseFreqUpdate"
            example:
              serverId: 1033
              siteId: 55
              serverIp: 203.0.113.10
              rules:
                - id: 701
                  serverId: 1033
                  url: /search
                  response_code: 404
                  time: 120
                  response_count: 50
                  behavior: block
                  status: ENABLE
      responses:
        "200":
          description: Rules applied
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L7/l7_update_useragent:
    post:
      tags: [L7 WAF]
      summary: Replace user-agent rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L7UserAgentUpdate"
            example:
              serverId: 1033
              siteId: 55
              serverIp: 203.0.113.10
              rules:
                - id: 801
                  serverId: 1033
                  url: "/*"
                  user_agent: curl/*
                  match: prefix
                  behavior: block
                  status: ENABLE
      responses:
        "200":
          description: Rules applied
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L7/l7_update_temporaryblacklist:
    post:
      tags: [L7 WAF]
      summary: Replace temporary blacklist entries
      description: |
        Dorian sends the full temporary blacklist for an edge when rows are
        added, deleted, or flushed. Each entry includes `site_id` so the block
        is applied to that site. Incoming agent reports to
        `/temporary_blacklist_added` should also send `site_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L7TemporaryBlacklistUpdate"
            example:
              serverId: 1033
              temporaryblacklist:
                - ip: 198.51.100.99
                  url: /wp-admin
                  country: US
                  city: New York
                  blocked_at: "2026-08-11T09:15:00Z"
                  ttl: 3600
                  trigger_rule: waf_interval_freq_limit
                  site_id: 55
                - ip: 203.0.113.200
                  url: /api/login
                  country: DE
                  city: Berlin
                  blocked_at: "2026-08-11T09:20:00Z"
                  ttl: 7200
                  trigger_rule: anti_cc
                  site_id: 55
      responses:
        "200":
          description: Blacklist applied
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L7/l7_update_upstreamservers:
    post:
      tags: [L7 Traffic]
      summary: Replace upstream origin servers for a site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L7UpstreamServersUpdate"
            example:
              serverId: 1033
              siteId: 55
              upstreams:
                - id: 11
                  serverId: 1033
                  ip_port: 10.10.0.5:8080
                  protocol: http
                  description: Primary origin
                - id: 12
                  serverId: 1033
                  ip_port: 10.10.0.6:8080
                  protocol: http
                  description: Failover origin
      responses:
        "200":
          description: Upstreams applied
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L7/l7_update_origin_routes:
    post:
      tags: [L7 Traffic]
      summary: Replace per-port origin pools for a site
      description: |
        Incremental update of `origin_routes` (same shape as the nested field on
        `l7_update_site`). A request on listen port P with scheme S is proxied to
        the pool of the S-rule whose `ports` contains P, using each upstream's own
        `protocol` (http/https). While a site has routes, a port with no rule
        has no origin and returns 502 (the flat `upstream_servers` union is not
        used). A port may appear in only one rule per scheme. Empty `http` and
        `https` clear the routes, and every port uses `upstream_servers` again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L7OriginRoutes"
            example:
              server_id: 1033
              site_id: 55
              http:
                - ports: [80]
                  upstreams:
                    - id: 1
                      serverId: 1033
                      ip_port: 10.0.0.1:8080
                      protocol: http
                      description: ""
                - ports: [9000, 9001]
                  upstreams:
                    - id: 3
                      serverId: 1033
                      ip_port: 10.0.0.3:8080
                      protocol: http
                      description: ""
              https:
                - ports: [443]
                  upstreams:
                    - id: 8
                      serverId: 1033
                      ip_port: 10.0.0.8:443
                      protocol: https
                      description: ""
      responses:
        "200":
          description: Origin routes applied
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L7/l7_update_site:
    post:
      tags: [L7 Traffic]
      summary: Push full site configuration
      description: |
        Called by Dorian when a site is created or updated (once per assigned
        edge server). Carries domain, SSL, classified WAF rules from
        `waf_rule_id`, compress, cache rules, selected HTTP/HTTPS site
        listening ports, upstream servers, and optional per-port
        `origin_routes` (preferred over the flat `upstream_servers` union).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L7SiteConfig"
            example:
              server_id: 1033
              site_id: 55
              domain: www.example.com
              ssl:
                ssl_type: custom
                ssl_cert: |
                  -----BEGIN CERTIFICATE-----
                  MIIB...
                  -----END CERTIFICATE-----
                ssl_cert_key: |
                  -----BEGIN PRIVATE KEY-----
                  MIIE...
                  -----END PRIVATE KEY-----
              waf_rules:
                waf_rule_id: 42
                waf_whitelist:
                  - id: 101
                    wafRuleId: 42
                    ips: 192.168.1.0/24
                    url: "/*"
                    method: GET,POST
                    description: Office network
                waf_blacklist:
                  - id: 201
                    wafRuleId: 42
                    ips: 198.51.100.77
                    url: "/*"
                    method: "*"
                    behavior: block
                    description: Known bad actor
                waf_geolocation:
                  - id: 301
                    wafRuleId: 42
                    country: CN,RU
                    url: "/*"
                    behavior: block
                    operation: BLACK
                    status: ENABLE
                waf_anticc:
                  - id: 401
                    wafRuleId: 42
                    url: /login
                    method: POST
                    threshold: 20
                    window: 60
                    action: block
                    behavior: block
                    status: ENABLE
                waf_antiheader:
                  - id: 501
                    wafRuleId: 42
                    url: "/*"
                    header: X-Forwarded-For
                    value: ""
                    blockMode: missing
                    behavior: block
                    status: ENABLE
                waf_intervalfreqlimit:
                  - id: 601
                    wafRuleId: 42
                    url: /login
                    time: 60
                    requestCount: 30
                    behavior: block
                    status: ENABLE
                waf_secondfreqlimit:
                  - id: 701
                    wafRuleId: 42
                    url: /api/*
                    requestCount: 100
                    burst: 20
                    behavior: block
                    status: ENABLE
                waf_responsefreq:
                  - id: 801
                    wafRuleId: 42
                    url: /search
                    responseCode: "404"
                    time: 120
                    responseCount: 50
                    behavior: block
                    status: ENABLE
                waf_useragent:
                  - id: 901
                    wafRuleId: 42
                    url: "/*"
                    userAgent: curl/*
                    match: prefix
                    behavior: block
                    status: ENABLE
              compress_settings:
                css: true
                html: true
                js: true
                audio: false
                font: true
                applications: false
              cache_rules:
                - id: 31
                  serverId: 1033
                  rule_name: static_assets
                  rule_type: file
                  caching_time: 86400
                  url: ""
                  file_types: jpg,png,css,js
                  priority: 10
                  cache_slice: 1.0
                  without_parameter: yes
                  cache_mode: origin
                  status: ENABLE
              http_ports:
                - id: 21
                  serverId: 1033
                  port: 80
                  protocol: HTTP
                  description: Public HTTP
                  status: ENABLE
              https_ports:
                - id: 22
                  serverId: 1033
                  port: 443
                  protocol: HTTPS
                  description: Public HTTPS
                  status: ENABLE
              upstream_servers:
                - id: 11
                  serverId: 1033
                  ip_port: 10.10.0.5:8080
                  protocol: http
                  description: Primary origin
              origin_routes:
                server_id: 1033
                site_id: 55
                http:
                  - ports: [80]
                    upstreams:
                      - id: 11
                        serverId: 1033
                        ip_port: 10.10.0.5:8080
                        protocol: http
                        description: Primary origin
                https: []
      responses:
        "200":
          description: Site configuration applied
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L7/l7_update_domain:
    post:
      tags: [L7 Traffic]
      summary: Rename a site domain on the edge
      description: |
        Called by Dorian when a site domain is changed (once per assigned edge
        server), before `l7_update_site` pushes the full config for the new
        hostname. Angelos should retarget the existing site from `old_domain`
        to `new_domain`. Older angelos builds that do not implement this route
        return HTML 404; Dorian still saves the new domain and surfaces that
        as a warning.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L7SiteDomainUpdate"
            example:
              server_id: 1033
              site_id: 55
              old_domain: old.example.com
              new_domain: www.example.com
      responses:
        "200":
          description: Site domain renamed on edge
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L7/l7_delete_site:
    post:
      tags: [L7 Traffic]
      summary: Remove a site from the edge
      description: |
        Called by Dorian before deleting a site from the database (once per
        assigned edge server). Angelos should drop the site domain and related
        L7 configuration for that `site_id`. Older angelos builds that do not
        implement this route return HTML 404; Dorian still deletes the site and
        surfaces that as a warning.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L7SiteDelete"
            example:
              server_id: 1033
              site_id: 55
              domain: www.example.com
      responses:
        "200":
          description: Site removed from edge
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L7/l7_update_listeningports:
    post:
      tags: [L7 Traffic]
      summary: Replace nginx listening ports on an edge server
      description: |
        Server-scoped. Syncs the edge `listening_ports` table — the ports nginx
        listens on overall. Angelos stores the full list in Redis under key
        `listeningports` and applies ENABLE entries to `server_default_ports.conf`
        (HTTP and HTTPS). Does not include `site_id` (see
        `l7_update_site_listeningports` for per-site port selection).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L7ListeningPortsUpdate"
            example:
              serverId: 1033
              listeningports:
                - id: 21
                  serverId: 1033
                  port: 80
                  protocol: HTTP
                  description: Public HTTP
                  status: ENABLE
                - id: 22
                  serverId: 1033
                  port: 443
                  protocol: HTTPS
                  description: Public HTTPS
                  status: ENABLE
      responses:
        "200":
          description: Ports applied
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L7/l7_update_site_listeningports:
    post:
      tags: [L7 Traffic]
      summary: Replace a site's selected HTTP/HTTPS listening ports
      description: |
        Site-scoped. Syncs `site_listening_ports` for one site on one edge —
        which HTTP and HTTPS ports that site should use. Called when site port
        selections are saved, and the same HTTP/HTTPS split is included in
        `l7_update_site`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L7SiteListeningPortsUpdate"
            example:
              server_id: 1033
              site_id: 55
              http_ports:
                - id: 21
                  serverId: 1033
                  port: 80
                  protocol: HTTP
                  description: Public HTTP
                  status: ENABLE
              https_ports:
                - id: 22
                  serverId: 1033
                  port: 443
                  protocol: HTTPS
                  description: Public HTTPS
                  status: ENABLE
      responses:
        "200":
          description: Site listening ports applied
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L7/l7_update_compress:
    post:
      tags: [L7 Traffic]
      summary: Update Gzip compress MIME settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L7CompressUpdate"
            example:
              serverId: 1033
              siteId: 55
              compress:
                css: true
                html: true
                js: true
                audio: false
                font: true
                applications: false
      responses:
        "200":
          description: Compress settings applied
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L7/l7_update_l7guard:
    post:
      tags: [L7 WAF]
      summary: Update L7 abuse detector (l7_guard) settings
      description: |
        Server-scoped. Sets the per-IP L7 abuse detector that runs in OpenResty
        (`resty.l7_guard`) and escalates offenders to the XDP blocklist.

        Per client IP, counted over `window` seconds; an IP is blocked when any
        threshold is reached:

        - `rst_threshold` — HTTP/2 streams reset by the client before a response
          (Rapid Reset; logged as 499 with ~0 request time)
        - `rej_threshold` — requests already rejected with 444 (per-IP rate /
          concurrency limit or an existing temporary block)
        - `bad_threshold` — malformed requests / empty connections (400/408 with
          no request line)
        - `req_threshold` — all requests (halved when most requests from the IP
          are HTTP/2 without `Accept` / `Accept-Language`)

        Blocked IPs are dropped by nginx immediately and, when `xdp` is true,
        added to the XDP blocklist for `block_ttl` seconds, doubling per repeat
        offense (within 24h) up to `block_max_ttl`. Loopback, private ranges,
        the server's own address, IPv6 and `allow_ips` are never blocked.

        The `l7guard` object **replaces** the stored settings; omitted fields use
        the defaults. `reset: true` (or an empty object) restores all defaults.
        Applied within ~10 s, no nginx reload. Requires the agent `token`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L7GuardUpdate"
            example:
              token: edge-agent-token-example
              serverId: 1033
              l7guard:
                enabled: true
                xdp: true
                window: 10
                rst_threshold: 100
                rej_threshold: 200
                bad_threshold: 20
                req_threshold: 1000
                block_ttl: 600
                block_max_ttl: 3600
                allow_ips: ["198.51.100.20"]
      responses:
        "200":
          description: Settings stored; `l7guard` is the effective configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/L7GuardState"
        "400":
          description: Validation error (`message` names the offending field)
        "403":
          description: Invalid token

  /API/L7/l7guard:
    get:
      tags: [L7 WAF]
      summary: Read L7 abuse detector (l7_guard) settings
      description: |
        Server-scoped. Returns the effective settings, the stored overrides and
        the built-in defaults. The same effective settings are included in
        `report_edge_configure` under `l7.edge.l7guard`.
      parameters:
        - $ref: "#/components/parameters/AgentBearer"
        - name: token
          in: query
          required: false
          schema:
            type: string
          description: Agent token (alternative to the Bearer header)
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/L7GuardState"
        "403":
          description: Invalid token

  /API/L7/l7_attacks:
    get:
      tags: [L7 WAF]
      summary: List recorded L7 attack incidents
      description: |
        Server-scoped. Incidents stored on the edge (SQLite, retained 180 days),
        newest first, plus the live detector state (per-vector state, current
        rate, enter/exit thresholds, baseline). Token via Bearer or `?token=`.
      parameters:
        - $ref: "#/components/parameters/AgentBearer"
        - { name: token, in: query, required: false, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: integer }, description: "started_at >= (unix seconds)" }
        - { name: to, in: query, required: false, schema: { type: integer }, description: "started_at <= (unix seconds)" }
        - { name: status, in: query, required: false, schema: { type: string, enum: [active, ended] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
      responses:
        "200":
          description: Incident summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  count: { type: integer }
                  attacks:
                    type: array
                    items:
                      $ref: "#/components/schemas/L7AttackSummary"
                  detector:
                    type: object
                    nullable: true
                    additionalProperties: true
        "403":
          description: Invalid token

  /API/L7/l7_attack:
    get:
      tags: [L7 WAF]
      summary: Full L7 attack incident
      description: |
        Server-scoped. Full incident (`?id=`), live while active. Token via
        Bearer or `?token=`.
      parameters:
        - $ref: "#/components/parameters/AgentBearer"
        - { name: token, in: query, required: false, schema: { type: string } }
        - { name: id, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Incident
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  attack:
                    $ref: "#/components/schemas/L7AttackIncident"
        "403":
          description: Invalid token
        "404":
          description: Unknown incident

  /API/L7/l7_update_cacherules:
    post:
      tags: [L7 Cache]
      summary: Replace cache rules
      description: Full rule set is sent on every create/update/delete.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L7CacheRulesUpdate"
            example:
              serverId: 1033
              siteId: 55
              cacherules:
                - id: 31
                  serverId: 1033
                  rule_name: static_assets
                  rule_type: file
                  caching_time: 86400
                  url: ""
                  file_types: jpg,png,css,js,woff2
                  priority: 10
                  cache_slice: 1.0
                  without_parameter: yes
                  cache_mode: origin
                  status: ENABLE
                - id: 32
                  serverId: 1033
                  rule_name: homepage
                  rule_type: url
                  caching_time: 300
                  url: https://www.example.com/
                  file_types: ""
                  priority: 5
                  cache_slice: 0
                  without_parameter: no
                  cache_mode: force
                  status: ENABLE
      responses:
        "200":
          description: Cache rules applied
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L7/l7_clear_cache:
    post:
      tags: [L7 Cache]
      summary: Purge all file cache on the edge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L7ServerIdOnly"
            example:
              serverId: 1033
              siteId: 55
      responses:
        "200":
          description: Cache cleared
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L7/l7_clear_url_cache:
    post:
      tags: [L7 Cache]
      summary: Purge URL cache by match pattern
      description: |
        `match_type` is numeric on the wire (CDNRAY convention):

        - `1` — prefix match (`http(s)://…/` ending with `/`)
        - `2` — exact match (`http(s)://…`)
        - `3` — advanced wildcard (any non-empty pattern)

        Dorian normalizes dashboard input (`prefix`, `exact`, `advanced`) before
        calling angelos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L7ClearUrlCache"
            examples:
              prefix:
                summary: Prefix purge
                value:
                  serverId: 1033
                  siteId: 55
                  match_type: 1
                  match_content: https://www.example.com/
              exact:
                summary: Exact URL purge
                value:
                  serverId: 1033
                  siteId: 55
                  match_type: 2
                  match_content: https://www.example.com/index.html
              advanced:
                summary: Advanced wildcard purge
                value:
                  serverId: 1033
                  siteId: 55
                  match_type: 3
                  match_content: www.example.com/*/api/*
      responses:
        "200":
          description: URL cache cleared
        "400":
          description: Invalid match_type or match_content
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L4/l4_firewall_data:
    post:
      tags: [L4 Firewall]
      summary: Push Layer 4 firewall configuration
      description: |
        Path defaults to `/API/L4/l4_firewall_data` (override via Dorian
        `agentL4Path` in config). Optional `Authorization: Bearer` header when
        `agentToken` is configured.
      parameters:
        - $ref: "#/components/parameters/AgentBearer"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L4ConfigPush"
            example:
              token: edge-agent-token-example
              id: 1033
              dev: eth0
              attachMode: native
              sensitivity: medium
              protectionMode: drop
              blackIpDuration: 3600
              synValid: true
              synThreshold: 1000
              synBurstPkt: 200
              synBurstCountPerSec: 50
              synFixedThreshold: 500
              synFixedCheckDuration: 10
              challengeTimeout: 30
              synProtectionDuration: 300
              ackValid: true
              ackThreshold: 2000
              ackBurstPkt: 300
              ackBurstCountPerSec: 80
              ackFixedThreshold: 800
              ackFixedCheckDuration: 10
              ackProtectionDuration: 300
              rstValid: false
              rstThreshold: 0
              icmpValid: true
              icmpThreshold: 500
              udpValid: true
              udpThreshold: 1500
              greValid: false
              tcpSegCheck: true
              geoCheck: false
              geoDbIpv4Path: /var/lib/geoip/GeoLite2-Country.mmdb
              geoDbLocationPath: /var/lib/geoip/GeoLite2-City.mmdb
              geoAllowCountries: []
              geoCountriesBlockMode: false
              tcpConnectionLimitCheck: true
              tcpConnectionLimitCnt: 5000
      responses:
        "200":
          description: L4 config applied
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L4/options:
    post:
      tags: [L4 Firewall]
      summary: Fetch attach interfaces and modes
      parameters:
        - $ref: "#/components/parameters/AgentBearer"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTokenBody"
            example:
              token: edge-agent-token-example
      responses:
        "200":
          description: Available L4 options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/L4Options"
              example:
                interfaces:
                  - eth0
                  - eth1
                attachModes:
                  - native
                  - skb
                  - drv
                attachModesByInterface:
                  eth0:
                    - native
                    - drv
                  eth1:
                    - native
                    - skb
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L4/add_white_ip:
    post:
      tags: [L4 Firewall]
      summary: Add IP to L4 whitelist
      parameters:
        - $ref: "#/components/parameters/AgentBearer"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L4IpAction"
            example:
              token: edge-agent-token-example
              ip: 192.168.50.10
      responses:
        "200":
          description: IP whitelisted
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L4/remove_white_ip:
    post:
      tags: [L4 Firewall]
      summary: Remove IP from L4 whitelist
      parameters:
        - $ref: "#/components/parameters/AgentBearer"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L4IpAction"
            example:
              token: edge-agent-token-example
              ip: 192.168.50.10
      responses:
        "200":
          description: IP removed
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L4/remove_white_ip_all:
    post:
      tags: [L4 Firewall]
      summary: Clear L4 whitelist
      parameters:
        - $ref: "#/components/parameters/AgentBearer"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTokenBody"
            example:
              token: edge-agent-token-example
      responses:
        "200":
          description: Whitelist cleared
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L4/add_block_ip:
    post:
      tags: [L4 Firewall]
      summary: Add IP to L4 blocklist
      parameters:
        - $ref: "#/components/parameters/AgentBearer"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L4IpAction"
            example:
              token: edge-agent-token-example
              ip: 198.51.100.99
      responses:
        "200":
          description: IP blocked
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L4/remove_block_ip:
    post:
      tags: [L4 Firewall]
      summary: Remove IP from L4 blocklist
      parameters:
        - $ref: "#/components/parameters/AgentBearer"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L4IpAction"
            example:
              token: edge-agent-token-example
              ip: 198.51.100.99
      responses:
        "200":
          description: IP unblocked
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L4/remove_block_ip_all:
    post:
      tags: [L4 Firewall]
      summary: Clear L4 blocklist
      parameters:
        - $ref: "#/components/parameters/AgentBearer"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTokenBody"
            example:
              token: edge-agent-token-example
      responses:
        "200":
          description: Blocklist cleared
        "4XX":
          $ref: "#/components/responses/AgentError"

components:
  parameters:
    AgentBearer:
      name: Authorization
      in: header
      required: false
      schema:
        type: string
      description: Optional Bearer agentToken header when configured in Dorian back-end

  responses:
    AgentError:
      description: Angelos rejected or failed the request
      content:
        text/plain:
          schema:
            type: string

  schemas:
    L7ServerIdOnly:
      type: object
      required: [serverId, siteId]
      properties:
        serverId:
          type: integer
          format: int64
          description: Edge server ID in Dorian
        siteId:
          type: integer
          format: int64
          description: Site whose cache should be purged

    L7ServerContext:
      type: object
      required: [serverId, siteId, serverIp]
      properties:
        serverId:
          type: integer
          format: int64
        siteId:
          type: integer
          format: int64
          description: Site these L7 rules belong to
        serverIp:
          type: string
          description: Edge node public IP

    L7WhitelistUpdate:
      allOf:
        - $ref: "#/components/schemas/L7ServerContext"
        - type: object
          properties:
            rules:
              type: array
              items:
                $ref: "#/components/schemas/WafWhitelistRule"

    L7BlacklistUpdate:
      allOf:
        - $ref: "#/components/schemas/L7ServerContext"
        - type: object
          properties:
            rules:
              type: array
              items:
                $ref: "#/components/schemas/WafBlacklistRule"

    L7GeolocationUpdate:
      allOf:
        - $ref: "#/components/schemas/L7ServerContext"
        - type: object
          properties:
            rules:
              type: array
              items:
                $ref: "#/components/schemas/WafGeoRule"

    L7AntiHeaderUpdate:
      allOf:
        - $ref: "#/components/schemas/L7ServerContext"
        - type: object
          properties:
            rules:
              type: array
              items:
                $ref: "#/components/schemas/WafAntiHeaderRule"

    L7IntervalFreqLimitUpdate:
      allOf:
        - $ref: "#/components/schemas/L7ServerContext"
        - type: object
          properties:
            rules:
              type: array
              items:
                $ref: "#/components/schemas/IntervalFreqLimitRule"

    L7SecondFreqLimitUpdate:
      allOf:
        - $ref: "#/components/schemas/L7ServerContext"
        - type: object
          properties:
            rules:
              type: array
              items:
                $ref: "#/components/schemas/SecondFreqLimitRule"

    L7ResponseFreqUpdate:
      allOf:
        - $ref: "#/components/schemas/L7ServerContext"
        - type: object
          properties:
            rules:
              type: array
              items:
                $ref: "#/components/schemas/ResponseFreqRule"

    L7UserAgentUpdate:
      allOf:
        - $ref: "#/components/schemas/L7ServerContext"
        - type: object
          properties:
            rules:
              type: array
              items:
                $ref: "#/components/schemas/UserAgentRule"

    L7TemporaryBlacklistUpdate:
      type: object
      required: [serverId, temporaryblacklist]
      properties:
        serverId:
          type: integer
          format: int64
        temporaryblacklist:
          type: array
          items:
            $ref: "#/components/schemas/TemporaryBlacklistEntry"

    L7UpstreamServersUpdate:
      type: object
      required: [serverId, siteId, upstreams]
      properties:
        serverId:
          type: integer
          format: int64
        siteId:
          type: integer
          format: int64
        upstreams:
          type: array
          items:
            $ref: "#/components/schemas/UpstreamServerL7"

    L7SiteConfig:
      type: object
      required: [server_id, site_id, domain, ssl, waf_rules, compress_settings, cache_rules, http_ports, https_ports, upstream_servers]
      properties:
        server_id:
          type: integer
          format: int64
          description: Edge server receiving this site config
        site_id:
          type: integer
          format: int64
        domain:
          type: string
        ssl:
          $ref: "#/components/schemas/L7SiteSSL"
        waf_rules:
          $ref: "#/components/schemas/L7SiteWafRules"
        compress_settings:
          $ref: "#/components/schemas/CompressSettingsL7"
        cache_rules:
          type: array
          items:
            $ref: "#/components/schemas/CacheRuleL7"
        http_ports:
          type: array
          items:
            $ref: "#/components/schemas/ListeningPortL7"
          description: HTTP listening ports selected for this site on this edge
        https_ports:
          type: array
          items:
            $ref: "#/components/schemas/ListeningPortL7"
          description: HTTPS listening ports selected for this site on this edge
        upstream_servers:
          type: array
          items:
            $ref: "#/components/schemas/UpstreamServerL7"
          description: Union of all origins (older agents); see origin_routes
        origin_routes:
          $ref: "#/components/schemas/L7OriginRoutes"
          description: |
            Optional per-port origin pools; preferred over upstream_servers.
            Listen ports not covered by a rule return 502 while routes exist.
            When absent (or both lists empty), any stored routes are removed and
            every port uses upstream_servers.

    L7OriginRoute:
      type: object
      required: [ports, upstreams]
      properties:
        ports:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 65535
          description: Edge listen ports served by this pool
        upstreams:
          type: array
          items:
            $ref: "#/components/schemas/UpstreamServerL7"
          description: Origin pool; upstream protocol defaults to the route scheme

    L7OriginRoutes:
      type: object
      required: [server_id, site_id]
      properties:
        server_id:
          type: integer
          format: int64
        site_id:
          type: integer
          format: int64
        http:
          type: array
          items:
            $ref: "#/components/schemas/L7OriginRoute"
        https:
          type: array
          items:
            $ref: "#/components/schemas/L7OriginRoute"

    L7SiteDomainUpdate:
      type: object
      required: [server_id, site_id, old_domain, new_domain]
      properties:
        server_id:
          type: integer
          format: int64
          description: Edge server that should rename the site
        site_id:
          type: integer
          format: int64
        old_domain:
          type: string
          description: Current hostname on the edge
        new_domain:
          type: string
          description: Replacement hostname

    L7SiteDelete:
      type: object
      required: [server_id, site_id, domain]
      properties:
        server_id:
          type: integer
          format: int64
          description: Edge server that should drop the site
        site_id:
          type: integer
          format: int64
        domain:
          type: string
          description: Site domain being removed

    L7SiteSSL:
      type: object
      properties:
        ssl_type:
          type: string
          description: |
            Certificate mode. `none` means HTTP-only for visitor↔edge (no HTTPS
            for this site; Angelos stores an empty ssl marker and clears site
            https_ports). Other values (custom, letsencrypt, zerossl,
            googletrust, managed) require ssl_cert + ssl_cert_key PEMs.
        ssl_cert:
          type: string
        ssl_cert_key:
          type: string

    L7SiteWafRules:
      type: object
      properties:
        waf_rule_id:
          type: integer
          format: int64
          description: Dorian waf_rules.id assigned to the site (0 if none)
        waf_whitelist:
