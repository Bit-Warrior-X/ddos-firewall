    L7GuardSettings:
      type: object
      description: |
        camelCase aliases are also accepted on input (e.g. `rstThreshold`,
        `blockTtl`, `allowIps`, `windowSeconds`, `xdpEscalation`).
      properties:
        enabled:
          type: boolean
          default: true
          description: Turn the detector on/off
        xdp:
          type: boolean
          default: true
          description: Escalate blocked IPs to the XDP blocklist (false = nginx-level block only)
        window:
          type: integer
          minimum: 1
          maximum: 300
          default: 10
          description: Counting window in seconds
        rst_threshold:
          type: integer
          minimum: 1
          maximum: 1000000
          default: 100
          description: Client-reset HTTP/2 streams per window
        rej_threshold:
          type: integer
          minimum: 1
          maximum: 1000000
          default: 200
          description: Requests rejected with 444 per window
        bad_threshold:
          type: integer
          minimum: 1
          maximum: 1000000
          default: 100
          description: Malformed requests (400/408, no request line) per window
        req_threshold:
          type: integer
          minimum: 1
          maximum: 1000000
          default: 1000
          description: Total requests per window
        block_ttl:
          type: integer
          minimum: 10
          maximum: 86400
          default: 600
          description: First block duration in seconds
        block_max_ttl:
          type: integer
          minimum: 10
          maximum: 604800
          default: 3600
          description: Maximum block duration for repeat offenders (>= block_ttl)
        allow_ips:
          type: array
          maxItems: 1000
          items:
            type: string
            format: ipv4
          default: []
          description: Client IPs never blocked by l7_guard (single addresses, no CIDR)
        attack_detect:
          type: boolean
          default: true
          description: L7 attack incident detection (report_l7_attack)
        attack_floor_flood:
          type: integer
          minimum: 10
          default: 500
          description: Minimum requests/s for the `flood` vector (raised automatically by the learned baseline)
        attack_floor_reset:
          type: integer
          minimum: 10
          default: 100
          description: Minimum client-reset HTTP/2 streams/s for `rapid_reset`
        attack_floor_malformed:
          type: integer
          minimum: 10
          default: 200
          description: Minimum malformed requests/s for `malformed`
        attack_floor_blocked:
          type: integer
          minimum: 10
          default: 200
          description: Minimum 444 responses/s for `blocked`
        attack_confirm_seconds:
          type: integer
          minimum: 1
          maximum: 60
          default: 3
          description: Consecutive seconds above threshold before a vector is under attack
        attack_exit_seconds:
          type: integer
          minimum: 5
          maximum: 3600
          default: 30
          description: Consecutive seconds below exit threshold before a vector is normal again
        attack_cooldown_seconds:
          type: integer
          minimum: 0
          maximum: 3600
          default: 60
          description: All vectors normal this long closes the incident (re-entry within it continues the same incident)

