          nullable: true
          description: Set when `firewall.config` could not be read
        whitelist:
          type: array
          items:
            $ref: "#/components/schemas/EdgeL4IpWhitelistEntry"
        blocklist:
          type: array
          items:
            $ref: "#/components/schemas/EdgeL4IpBlocklistEntry"

    EdgeL7SiteConfigure:
      type: object
      properties:
        domain:
          type: string
          description: Primary hostname (`site:{id}:domain`)
        domains:
          type: array
          items:
            type: string
          description: All Hosts mapped via `domain:{host}`
        waf:
          type: object
          additionalProperties: true
          description: |
            Keys are WAF rule types (`whitelist`, `blacklist`, `geo`, `anticc`,
            `antiheader`, `intervalfreqlimit`, `secondfreqlimit`, `responsefreq`,
            `useragent`). Values are Redis JSON payloads.
        cache:
          type: array
          items:
            type: object
            additionalProperties: true
        listening:
          type: object
          additionalProperties: true
        upstreamservers:
          type: array
          items:
            type: object
            properties:
              ip_port:
                type: string
              description:
                type: string
        compress:
          type: object
          additionalProperties: true
        ssl:
          type: object
          additionalProperties: true
          description: |
            When `include_ssl_pems` is false, PEMs are replaced with
            `ssl_cert_present` / `ssl_cert_key_present` and length fields.

    EdgeL7Configure:
      type: object
      properties:
        edge:
          type: object
          properties:
            listeningports:
              type: array
              items:
                type: object
                additionalProperties: true
            temporaryblacklist:
              type: array
              items:
                type: object
                additionalProperties: true
            acl_rules:
              type: array
              items:
                type: object
                additionalProperties: true
            acl_apply_rules:
              type: array
              items:
                type: object
                additionalProperties: true
            l7guard:
              $ref: "#/components/schemas/L7GuardSettings"
            legacy_global:
              type: object
              additionalProperties: true
              description: Legacy non-site Redis keys (`whitelist`, `cacherules`, …)
        sites:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/EdgeL7SiteConfigure"
          description: Map of site_id (string) → site configure
        files:
          type: object
          properties:
            server_default_ports_conf:
              type: string
              nullable: true
              description: Contents of Athens `server_default_ports.conf`

    CacheHitContentTypeItem:
      type: object
      required: [site_id, content_type, request_count, cached_request_count, cache_hit_ratio]
      properties:
        site_id:
          type: integer
        content_type:
          type: string
          description: Family of Content-Type (html, css, js, json, image, video, …)
        request_count:
          type: integer
        cached_request_count:
          type: integer
          description: HIT + STALE + UPDATING + REVALIDATED
        cache_hit_ratio:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: cached_request_count / request_count
        traffic_l7_tx:
          type: integer
        traffic_cached_tx:
          type: integer

    CacheHitTopMissUrlItem:
      type: object
      required: [site_id, domain, url, miss_count, request_count]
      properties:
        site_id:
          type: integer
        domain:
          type: string
          description: Request Host
        url:
          type: string
          description: Path without query string
        miss_count:
          type: integer
          description: Requests with upstream_cache_status MISS or EXPIRED
        request_count:
          type: integer

    CacheHitReport:
      type: object
      required: [token, command, reported_at, timestamp, content_types, top_miss_urls]
      description: |
        One closed Athens stats bucket for the panel cache-hit page.
      properties:
        token:
          type: string
        command:
          type: string
          enum: [report_cache_hit]
        reported_at:
          type: integer
          format: int64
        timestamp:
          type: integer
          format: int64
          description: Athens bucket start (unix seconds)
        interval_seconds:
          type: integer
          description: Bucket width (default 60)
        content_types:
          type: array
          items:
            $ref: "#/components/schemas/CacheHitContentTypeItem"
        top_miss_urls:
          type: array
          items:
            $ref: "#/components/schemas/CacheHitTopMissUrlItem"
        content_type_request_stats:
          type: array
          description: Alias of `content_types` (Athens metrics API name)
          items:
            $ref: "#/components/schemas/CacheHitContentTypeItem"
        cache_miss_url_stats:
          type: array
          description: Alias of `top_miss_urls` (Athens metrics API name)
          items:
            $ref: "#/components/schemas/CacheHitTopMissUrlItem"
        content_types_count:
          type: integer
        top_miss_urls_count:
          type: integer

    EdgeConfigureReport:
      type: object
      required: [token, command, reported_at, l4, l7]
      description: |
        Full edge configure snapshot posted by angelos to the panel every minute.
      properties:
        token:
          type: string
          description: Edge auth token (same as other panel APIs)
        command:
          type: string
          enum: [report_edge_configure]
        reported_at:
          type: integer
          format: int64
          description: Unix epoch seconds when the snapshot was built
        include_ssl_pems:
          type: boolean
          description: Whether `l7.sites.*.ssl` contains full PEM material
        whitelist:
          type: array
          items:
            $ref: "#/components/schemas/EdgeL4IpWhitelistEntry"
          description: Flat copy of `l4.whitelist` (convenience)
        blocklist:
          type: array
          items:
            $ref: "#/components/schemas/EdgeL4IpBlocklistEntry"
          description: Flat copy of `l4.blocklist` (convenience)
        whitelist_count:
          type: integer
        blocklist_count:
          type: integer
        site_count:
          type: integer
        temporaryblacklist_count:
          type: integer
        l4:
          $ref: "#/components/schemas/EdgeL4Configure"
        l7:
          $ref: "#/components/schemas/EdgeL7Configure"
