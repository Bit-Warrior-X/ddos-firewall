# /etc/sysctl.d/99-ddos-firewall.conf
# System tuning for XDP/eBPF anti-DDoS firewall
# SAFE for bond/team interfaces and servers behind load balancers
# Apply with: sysctl -p /etc/sysctl.d/99-ddos-firewall.conf

# =====================================================================
# 1. TCP SYN FLOOD PROTECTION
# =====================================================================

net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 65536
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_syn_retries = 2

# =====================================================================
# 2. CONNTRACK TUNING
# =====================================================================

net.netfilter.nf_conntrack_max = 2097152
net.netfilter.nf_conntrack_tcp_timeout_established = 1800
net.netfilter.nf_conntrack_tcp_timeout_syn_recv = 30
net.netfilter.nf_conntrack_tcp_timeout_syn_sent = 30
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_close_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_fin_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_close = 10
net.netfilter.nf_conntrack_tcp_timeout_last_ack = 15
# Phase 0 (C4): do not pick up mid-flow TCP as ESTABLISHED. Loose pickup of a
# raw PSH+ACK used to enter tcp_established_map and skip STOMP/HANDSHAKE.
net.netfilter.nf_conntrack_tcp_loose = 0
net.netfilter.nf_conntrack_udp_timeout = 30
net.netfilter.nf_conntrack_udp_timeout_stream = 60
net.netfilter.nf_conntrack_icmp_timeout = 10

# =====================================================================
# 3. NETWORK STACK HARDENING
# =====================================================================

# Disable source routing
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# Disable ICMP redirects
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Reverse path filtering — use LOOSE mode (2) for bond/team interfaces.
# Strict mode (1) breaks bond interfaces because packets arrive on a
# physical slave (eth0/eth1) but the route points to bond0. The kernel
# sees the interface mismatch and drops the packet as "spoofed".
# Loose mode only checks that the source IP is routable via ANY interface,
# which is correct for bonded setups.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

# Ignore broadcast ICMP (smurf attack protection)
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Rate limit ICMP error messages
net.ipv4.icmp_ratelimit = 100
net.ipv4.icmp_ratemask = 88089

# Log martian packets (optional — can be noisy under attack, set to 0 if so)
net.ipv4.conf.all.log_martians = 0
net.ipv4.conf.default.log_martians = 0

# DO NOT disable ip_forward if your server does any routing, NAT,
# Docker, LXC, KVM, or if it's behind a load balancer that needs it.
# Leave it at whatever your system already has.
# net.ipv4.ip_forward = 0    # REMOVED — breaks many setups

# =====================================================================
# 4. TCP STACK PERFORMANCE
# =====================================================================

net.ipv4.tcp_max_tw_buckets = 2000000
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 15
net.ipv4.tcp_keepalive_probes = 5
net.core.somaxconn = 65536
net.core.netdev_max_backlog = 250000
net.ipv4.tcp_max_orphans = 262144
net.ipv4.tcp_slow_start_after_idle = 0

# =====================================================================
# 5. SOCKET BUFFER SIZING
# =====================================================================

net.core.rmem_max = 16777216
net.core.rmem_default = 4194304
net.core.wmem_max = 16777216
net.core.wmem_default = 4194304
net.ipv4.tcp_rmem = 4096 1048576 16777216
net.ipv4.tcp_wmem = 4096 1048576 16777216
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_timestamps = 1

# =====================================================================
# 6. BPF MAP MEMORY
# =====================================================================

vm.max_map_count = 1048576
kernel.core_pattern=/var/crash/core.%e.%p.%t